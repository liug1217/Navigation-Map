<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Navigation Map</title>
<style>
/* ===== OpenStreetMap Layer ===== */
#map{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:0;
} 

/* UI must be above map */
.rect2,.bottomBar,.rect4{
  z-index:2;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#C5DCF0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
}

.bottomBar{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:166px;
}

.rect1{
  box-sizing:border-box;
  position:absolute;
  left:8px;
  right:8px;
  top:0;
  height:166px;
  border-width:1.5px 1.5px 0 1.5px;
  border-style:solid;
  border-color:#FFFFFF;
  box-shadow:0 4px 4px rgba(0,0,0,0.25), 0 4px 4px rgba(0,0,0,0.25);
  border-radius:11px 11px 0 0;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.rect3{
  position:absolute;
  width:46px;
  height:4px;
  left:50%;
  top:5px;
  transform:translateX(-50%);
  background:#74767A;
  box-shadow:0 4px 4px rgba(0,0,0,0.25), 0 4px 4px rgba(0,0,0,0.25);
  border-radius:2.5px;
}

.info{
  position:absolute;
  left:50%;
  top:13px;
  transform:translateX(-50%);
  font-family:"SF Pro Display","SF Pro Text",Arial,sans-serif;
  font-weight:500;
  font-size:20px;
  color:#000000;
  white-space:nowrap;
  text-shadow:0 4px 4px rgba(0,0,0,0.25);
}

.rect4{
  box-sizing:border-box;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:176px;
  width:auto;
  max-width:calc(100% - 16px);
  height:33px;
  padding:0 13px;
  background:#FFFFFF;
  border:1.5px solid #FFFFFF;
  box-shadow:0 4px 4px rgba(0,0,0,0.25);
  border-radius:16.5px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0px;
  z-index:5;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.rect4-inner{
  display:flex;
  align-items:center;
}

.rect4 .label{
  font-family:"SF Pro Display","SF Pro Text",Arial,sans-serif;
  font-weight:500;
  font-size:16px;
  color:#000000;
  text-shadow:0 4px 4px rgba(0,0,0,0.25);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding:5px 0;
}

.rect4 .icon{
  width:20px;
  height:20px;
  background:url('https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/TWHW3.svg/120px-TWHW3.svg.png') center/cover no-repeat;
  filter:drop-shadow(0px 4px 4px rgba(0,0,0,0.25));
  display:none;
  margin-left:6px;
}

.rect8{
  position:absolute;
  width:calc(100% - 16px);
  height:69px;
  left:8px;
  top:54px;
  background:#0E1A2D;
  border-radius:12px;
  box-shadow:0 4px 4px rgba(0,0,0,0.25);
  z-index:5;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:14px;
  box-sizing:border-box;
}
.rect8Icon{
  font-size:30px;
  color:#FFFFFF;
  line-height:1;
  width:36px;
  text-align:center;
  flex-shrink:0;
}
.rect8TextWrap{
  flex:1;
  min-width:0;
}
.rect8Distance{
  color:#9FB3D1;
  font-size:12px;
  margin-bottom:2px;
}
.rect8Instruction{
  color:#FFFFFF;
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ===== 🔍 搜尋地點 ===== */
.searchBarWrap{
  position:absolute;
  left:8px;
  right:8px;
  top:50px;
  z-index:5;
}
.searchBar{
  display:flex;
  align-items:center;
  background:#FFFFFF;
  border-radius:24px;
  box-shadow:0 4px 4px rgba(0,0,0,0.25);
  padding:0 8px 0 16px;
  height:48px;
}
.searchBar input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  font-size:15px;
  font-family:inherit;
  color:#000;
}
.searchBar input::placeholder{ color:#999; }
.searchIconBtn{
  border:none;
  background:transparent;
  font-size:18px;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
}
.searchResultsList{
  margin-top:8px;
  background:#FFFFFF;
  border-radius:14px;
  box-shadow:0 4px 4px rgba(0,0,0,0.25);
  max-height:260px;
  overflow-y:auto;
  display:none;
}
.searchResultItem{
  padding:10px 14px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}
.searchResultItem:last-child{ border-bottom:none; }
.searchResultItem:active{ background:#f2f2f2; }
.searchResultItem .name{
  font-weight:700;
  font-size:14px;
  color:#000;
}
.searchResultItem .addr{
  font-size:12px;
  color:#666;
  margin-top:2px;
}
.searchResultsEmpty{
  padding:14px;
  font-size:13px;
  color:#888;
  text-align:center;
}

/* ===== 📍 選定地點後的導航面板 ===== */
.destPanel{
  position:absolute;
  left:8px;
  right:8px;
  bottom:180px;
  z-index:5;
  background:#FFFFFF;
  border-radius:14px;
  box-shadow:0 4px 4px rgba(0,0,0,0.25);
  padding:12px 14px;
  display:none;
}
.destName{
  font-weight:700;
  font-size:15px;
  color:#000;
}
.destAddr{
  font-size:12px;
  color:#666;
  margin:4px 0 10px;
}
.destButtons{
  display:flex;
  gap:8px;
}
.navigateBtn{
  flex:1;
  background:#2F80FF;
  color:#FFFFFF;
  border:none;
  border-radius:10px;
  padding:11px 0;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}
.closeDestBtn{
  background:#EEEEEE;
  color:#333;
  border:none;
  border-radius:10px;
  padding:11px 16px;
  font-size:14px;
  cursor:pointer;
}

/* ===== 自訂地圖控制按鈕 ===== */
.mapCtrlGroup{
  position:fixed;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  z-index:10;
}
.mapCtrlBtn{
  width:40px;
  height:40px;
  border-radius:12px;
  border:none;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(10px);
  box-shadow:0 2px 8px rgba(0,0,0,0.28);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  transition:background 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.mapCtrlBtn:active{ background:rgba(230,230,230,0.95); }

.compassBtn svg{
  transition:transform 0.2s linear;
}

/* ===== 時鐘 ===== */
.mapClock{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(8px);
  color:#fff;
  border-radius:20px;
  padding:4px 14px;
  font-size:15px;
  font-weight:600;
  letter-spacing:0.5px;
  z-index:10;
  pointer-events:none;
  white-space:nowrap;
}

/* ===== 隱藏 MapLibre 預設按鈕 ===== */
.maplibregl-ctrl-top-right,
.maplibregl-ctrl-bottom-right{ display:none!important; }

.rect6{
  position:absolute;
  width:76px;
  height:76px;
  left:8px;
  top:132px;
  background:#FFFFFF;
  box-shadow:0 4px 4px rgba(0,0,0,0.25);
  border-radius:38px;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction: column;

  font-size:24px;
  font-weight:400;
  color:#000000;
  font-family:"SF Pro Display","SF Pro Text",Arial,sans-serif;
}

.rect6 .speed-value {
  font-size: 32px;
  font-weight: 600;
}

.rect6 .speed-unit {
  font-size: 12px;
  font-weight: 400;
}

/* ===== 🆕 底部面板大改版新增元件 ===== */
.arrivalText{
  position:absolute;
  left:50%;
  top:37px;
  transform:translateX(-50%);
  font-family:"SF Pro Display","SF Pro Text",Arial,sans-serif;
  font-weight:500;
  font-size:20px;
  color:#404345;
  white-space:nowrap;
  text-shadow:0 4px 4px rgba(0,0,0,0.25);
}

.navExitBtn,.navOverviewBtn{
  position:absolute;
  top:36px;
  font-family:"SF Pro Display","SF Pro Text",Arial,sans-serif;
  font-weight:500;
  font-size:13px;
  color:#000000;
  background:none;
  border:none;
  padding:6px;
  cursor:pointer;
  text-shadow:0 4px 4px rgba(0,0,0,0.25);
}

.navExitBtn{ left:6px; }
.navOverviewBtn{ right:6px; }

.navInfoCard{
  box-sizing:border-box;
  position:absolute;
  left:12px;
  right:12px;
  top:71px;
  height:60px;
  background:#FFFFFF;
  box-shadow:0 4px 4px rgba(0,0,0,0.25);
  border-radius:8px;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.navInfoCardIcon{
  width:59px;
  height:60px;
  flex-shrink:0;
  background:url('https://upload.wikimedia.org/wikipedia/zh/thumb/d/d1/ROC_Police_Broadcasting_Service_Seal.svg/1280px-ROC_Police_Broadcasting_Service_Seal.svg.png') center/contain no-repeat #FFFFFF;
  border-radius:8px;
  filter:drop-shadow(0px 4px 4px rgba(0,0,0,0.25));
}

.navInfoCardMeta{
  flex:0 0 auto;
  margin-left:12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.navInfoCardText{
  font-family:"SF Pro Display","SF Pro Text",Arial,sans-serif;
  font-weight:500;
  font-size:14px;
  color:#000000;
  text-shadow:0 4px 4px rgba(0,0,0,0.25);
  line-height:1;
}
.navInfoCardFreq{
  font-family:"SF Pro Display","SF Pro Text",Arial,sans-serif;
  font-size:11px;
  font-weight:600;
  color:#2F80FF;
  line-height:1;
  margin-top:3px;
  letter-spacing:0.3px;
}
.navInfoCardStatus{
  font-family:"SF Pro Display","SF Pro Text",Arial,sans-serif;
  font-size:11px;
  color:#6E6E73;
  line-height:1;
  margin-top:3px;
}
/* FM 刻度盤：flex item，在文字右邊 */
.fmDial{
  flex:1;
  height:40px;
  overflow:hidden;
  cursor:grab;
  user-select:none;
  align-self:center;
  position:relative;
}
.fmDial:active{ cursor:grabbing; }
.fmNeedle{
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:2px;
  margin-left:-1px;
  background:#2F80FF;
  border-radius:1px;
  z-index:2;
  pointer-events:none;
}
.fmNeedle::after{
  content:'';
  position:absolute;
  top:-1px;
  left:50%;
  transform:translateX(-50%);
  width:6px;
  height:6px;
  border-radius:50%;
  background:#2F80FF;
}
.fmTrack{
  position:absolute;
  top:0;
  height:100%;
  display:flex;
  align-items:center;
  transition:transform 0.25s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.fmTick{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  width:60px;
  height:100%;
  flex-shrink:0;
  position:relative;
}
.fmTick .tick-line{
  width:1px;
  height:10px;
  background:#C7C7CC;
  border-radius:1px;
  margin-bottom:2px;
}
.fmTick .tick-label{
  font-family:"SF Pro Display","SF Pro Text",Arial,sans-serif;
  font-size:10px;
  color:#8E8E93;
  line-height:1;
  white-space:nowrap;
}
.fmTick.active .tick-line{ background:#2F80FF; height:14px; }
.fmTick.active .tick-label{ color:#2F80FF; font-weight:700; }
.navInfoCardArrow{
  width:28px;
  height:28px;
  flex-shrink:0;
  background:none;
  border:none;
  color:#8E8E93;
  font-size:22px;
  line-height:1;
  cursor:pointer;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.navInfoCardPlayBtn{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#2F80FF;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  margin-right:12px;
  position:relative;
}
.navInfoCardPlayBtn .play-icon{
  width:0;
  height:0;
  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
  border-left:10px solid white;
  margin-left:2px;
  display:block;
}
.navInfoCardPlayBtn .pause-icon{
  display:none;
  gap:3px;
}
.navInfoCardPlayBtn .pause-icon span{
  display:block;
  width:3px;
  height:12px;
  background:white;
  border-radius:1px;
}
.navInfoCardPlayBtn.playing .play-icon{ display:none; }
.navInfoCardPlayBtn.playing .pause-icon{ display:flex; }


/* ===== 📷 CCTV 即時影像 ===== */
/* ===== 📷 CCTV 即時影像:置中大尺寸彈出視窗 ===== */
.cctvOverlay{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:88%;
  max-width:640px;
  padding:14px;
  box-sizing:border-box;
  background:rgba(14,26,45,0.95);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 12px 40px rgba(0,0,0,0.45);
  border-radius:14px;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  z-index:50;
  font-family:"SF Pro Display","SF Pro Text",Arial,sans-serif;
  display:none;
}

.cctvOverlay.show{
  display:block;
}

.cctvPanelTitle{
  font-size:18px;
  font-weight:700;
  color:#FFFFFF;
  margin-bottom:10px;
  padding-right:36px;
  cursor:move;
  user-select:none;
}

.cctvImage{
  width:100%;
  border-radius:8px;
  display:block;
  background:#000000;
}

.cctvStatus{
  margin-top:10px;
  color:#B9C2D0;
  font-size:13px;
  line-height:17px;
}

.cctvCloseBtn{
  position:absolute;
  top:10px;
  right:10px;
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,0.12);
  color:#FFFFFF;
  font-size:18px;
  line-height:30px;
  text-align:center;
  cursor:pointer;
}

.cctvCloseBtn:active{
  background:rgba(255,255,255,0.25);
}

.maplibregl-marker img{
  width:40px !important;
  height:auto !important;
  object-fit:contain;
  display:block;
}

.maplibregl-user-location-dot{
  background-color:#1E90FF !important;
  width:14px !important;
  height:14px !important;
  border-radius:50%;
  border:2px solid #ffffff !important;
  box-shadow:0 0 0 6px rgba(30,144,255,0.25);
}

.maplibregl-user-location-accuracy-circle{
  fill:rgba(30,144,255,0.15) !important;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  touch-action: none;
}

/* ===== 🌩️ 中央氣象署天氣特報橫幅 ===== */
.weatherAlert{
  position:absolute;
  left:50%;
  top:8px;
  transform:translateX(-50%);
  z-index:6;
  max-width:calc(100% - 32px);
  background:rgba(211,47,47,0.92);
  color:#FFFFFF;
  padding:8px 16px;
  border-radius:12px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
  font-size:14px;
  font-weight:600;
  box-shadow:0 4px 8px rgba(0,0,0,0.3);
  text-align:center;
  display:none;
}

/* ===== 🌋 中央氣象署地震報告橫幅 ===== */
.earthquakeAlert{
  position:absolute;
  left:50%;
  top:52px;
  transform:translateX(-50%);
  z-index:6;
  max-width:calc(100% - 32px);
  background:rgba(230,126,0,0.92);
  color:#FFFFFF;
  padding:8px 16px;
  border-radius:12px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
  font-size:14px;
  font-weight:600;
  box-shadow:0 4px 8px rgba(0,0,0,0.3);
  text-align:center;
  display:none;
}
</style>
</head>
<body>

<div id="map"></div>

<!-- 🌩️ 天氣特報橫幅(目前所在縣市有特報時顯示) -->
<div class="weatherAlert" id="weatherAlert"></div>

<!-- 🌋 地震報告橫幅(目前所在縣市在最新地震有感範圍內時顯示) -->
<div class="earthquakeAlert" id="earthquakeAlert"></div>

<!-- 🔍 搜尋地點 -->
<div class="searchBarWrap" id="searchBarWrap">
  <div class="searchBar">
    <input type="text" id="searchInput" placeholder="搜尋地點、地址" autocomplete="off" />
    <button type="button" class="searchIconBtn" id="searchBtn">🔍</button>
  </div>
  <div class="searchResultsList" id="searchResultsList"></div>
</div>

<!-- 📍 選定地點後的導航面板 -->
<div class="destPanel" id="destPanel">
  <div class="destName" id="destName"></div>
  <div class="destAddr" id="destAddr"></div>
  <div class="destButtons">
    <button type="button" class="navigateBtn" id="navigateBtn">開始導航</button>
    <button type="button" class="closeDestBtn" id="closeDestBtn">✕</button>
  </div>
</div>

<!-- 🧪 測速照相語音播報測試面板 -->
<div id="speedCamTestPanel" style="
  position: fixed;
  top: 80px;
  right: 12px;
  z-index: 9999;
  background: rgba(0,0,0,0.75);
  color: #fff;
  padding: 10px 12px;
  border-radius: 10px;
  font-family: -apple-system, sans-serif;
  font-size: 12px;
  width: 160px;
  display: none;
">
  <div style="font-weight:700; margin-bottom:6px;">🔊 測速語音測試</div>
  <div id="speedCamTestInfo" style="color:#ccc; margin-bottom:6px; line-height:1.4;">載入中...</div>

  <div style="font-size:11px; color:#aaa; margin-bottom:2px;">模擬車速 km/h</div>
  <input id="speedCamTestSpeed" type="number" value="70" style="
    width: 100%;
    box-sizing: border-box;
    padding: 4px 6px;
    border-radius: 6px;
    border: none;
    margin-bottom: 4px;
    font-size: 13px;
  " placeholder="模擬車速 km/h" />
  <button id="speedCamUseRealSpeedBtn" style="
    width: 100%;
    padding: 4px 0;
    border-radius: 6px;
    border: none;
    background: #555;
    color: #fff;
    font-size: 11px;
    margin-bottom: 8px;
    cursor: pointer;
  ">使用目前實際車速</button>

  <div style="font-size:11px; color:#aaa; margin-bottom:2px;">模擬距離 公尺</div>
  <input id="speedCamTestDistance" type="number" value="100" style="
    width: 100%;
    box-sizing: border-box;
    padding: 4px 6px;
    border-radius: 6px;
    border: none;
    margin-bottom: 6px;
    font-size: 13px;
  " placeholder="模擬距離 公尺" />

  <button id="speedCamTestBtn" style="
    width: 100%;
    padding: 6px 0;
    border-radius: 6px;
    border: none;
    background: #FF0000;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  ">播報測試</button>

  <div style="height:1px; background:#444; margin:10px 0;"></div>

  <div style="font-weight:700; margin-bottom:6px;">🧭 轉彎語音測試</div>
  <button id="turnByTurnTestBtn" style="
    width: 100%;
    padding: 6px 0;
    border-radius: 6px;
    border: none;
    background: #2F80FF;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  ">測試轉彎播報</button>
</div>

<div class="rect8" id="rect8" style="display:none;">
  <div class="rect8Icon" id="rect8Icon">↑</div>
  <div class="rect8TextWrap">
    <div class="rect8Distance" id="rect8Distance"></div>
    <div class="rect8Instruction" id="rect8Instruction"></div>
  </div>
</div>

<div class="rect6">
  <div class="speed-value">0</div>
  <div class="speed-unit">km/h</div>
</div>

<script src="https://unpkg.com/@maplibre/maplibre-gl-geocoder/dist/maplibre-gl-geocoder.min.js"></script>
<script>
  const satelliteStyle = {
    version: 8,
    sources: {
      'esri-satellite': {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256,
        attribution: '© Esri, Maxar, GeoEye, Earthstar Geographics, CNES/Airbus DS',
        maxzoom: 19
      }
    },
    layers: [
      {
        id: 'background',
        type: 'background',
        paint: { 'background-color': '#000' }
      },
      {
        id: 'satellite',
        type: 'raster',
        source: 'esri-satellite'
      }
    ]
  };

  const map = new maplibregl.Map({
    container: 'map',
    style: satelliteStyle,
    center: [121.394, 24.951],
    zoom: 16,
    pitch: 60,
    bearing: -20,
    antialias: false,
    preserveDrawingBuffer: true
  });

  map.on('load', () => {
    map.dragRotate.enable();
    map.touchZoomRotate.enableRotation();
    map.boxZoom.disable();
    map.scrollZoom.enable();
    map.dragPan.enable();

  // 使用者手動拖曳地圖時,暫停自動跟隨定位點,避免地圖被強制拉回;
  // 點擊定位按鈕(GeolocateControl)恢復跟隨。
  let followUser = true;
  map.on('dragstart', () => { followUser = false; });

  map.on('load',()=>{

const geolocate = new maplibregl.GeolocateControl({
  positionOptions: {
    enableHighAccuracy: true
  },
  trackUserLocation: true,
  showUserHeading: true
});

map.addControl(geolocate);
geolocate.on('trackuserlocationstart', () => { followUser = true; });
geolocate.trigger();
  });
  /* 移除預設 NavigationControl，改用自訂控制項 */


  const infoElement = document.querySelector('.info');
  const rect6SpeedValue = document.querySelector('.rect6 .speed-value');
  const rect6SpeedUnit = document.querySelector('.rect6 .speed-unit');
  
  let startTime = null;
  let lastPosition = null;
  let totalDistance = 0;
  let routeCoordinates = [];
  let marker = null;
  let routeSource = null;

  // ===== 🆕 退出 / 全覽 按鈕 =====
  const navExitBtn = document.getElementById('navExitBtn');
  const navOverviewBtn = document.getElementById('navOverviewBtn');

  if(navExitBtn){
    navExitBtn.addEventListener('click', () => {
      if(confirm('要結束本次路線記錄並重新開始嗎?')){
        location.reload();
      }
    });
  }

  if(navOverviewBtn){
    navOverviewBtn.addEventListener('click', () => {
      // 優先顯示規劃中的真實導航路線,沒有規劃路線時才退回GPS軌跡記錄
      const planned = window.plannedRouteCoordinates;
      if (planned && planned.length >= 2) {
        const lons = planned.map(c => c[0]);
        const lats = planned.map(c => c[1]);
        const bounds = [
          [Math.min(...lons), Math.min(...lats)],
          [Math.max(...lons), Math.max(...lats)]
        ];
        map.fitBounds(bounds, { padding: 80, duration: 800 });
        return;
      }

      if(routeCoordinates.length < 2){
        // 還沒有足夠的路線資料,直接把目前位置縮小看一下週邊
        if(routeCoordinates.length === 1){
          map.easeTo({ center: routeCoordinates[0], zoom: 13 });
        }
        return;
      }
      const lons = routeCoordinates.map(c => c[0]);
      const lats = routeCoordinates.map(c => c[1]);
      const bounds = [
        [Math.min(...lons), Math.min(...lats)],
        [Math.max(...lons), Math.max(...lats)]
      ];
      map.fitBounds(bounds, { padding: 80, duration: 800 });
    });
  }

  map.on('load', () => {
    map.addSource('route', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: []
      }
    });

    map.addLayer({
      id: 'route',
      type: 'fill-extrusion',
      source: 'route',
      paint: {
        'fill-extrusion-color': '#888888',
        'fill-extrusion-height': 0.1,
        'fill-extrusion-base': 0,
        'fill-extrusion-opacity': 1
      }
    });

    map.addLayer({
      id: 'route-outline',
      type: 'line',
      source: 'route',
      layout: {
        'line-join': 'round',
        'line-cap': 'round'
      },
      paint: {
        'line-color': '#ffffff',
        'line-width': 4,
        'line-opacity': 1
      }
    });

    // ===== 🧭 搜尋地點 → 真實路線規劃用的圖層(跟上面GPS軌跡記錄的route圖層分開) =====
    map.addSource('navRoute', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });

    map.addLayer({
      id: 'navRoute-outline',
      type: 'line',
      source: 'navRoute',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#FFFFFF', 'line-width': 10, 'line-opacity': 0.9 }
    });

    map.addLayer({
      id: 'navRoute-line',
      type: 'line',
      source: 'navRoute',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#2F80FF', 'line-width': 6, 'line-opacity': 0.95 }
    });

    window.navRouteSource = map.getSource('navRoute');
    routeSource = map.getSource('route');

  });

  function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = 
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  // ===== 📷 定位經過監視器附近時自動顯示 =====
  const CCTV_AUTO_SHOW_RADIUS_KM = 0.1; // 100 公尺內視為「經過」

  function checkCctvProximity(lat, lon){
    const cameras = window.cctvCameras;
    if(!cameras || !cameras.length) return;

    // 找出範圍內最近的一支監視器
    let nearest = null;
    let nearestDist = Infinity;
    for(let i = 0; i < cameras.length; i++){
      const cam = cameras[i];
      if (cam.hidden) continue; // 座標有問題的監視器,不參與定位接近偵測
      const d = calculateDistance(lat, lon, cam.lat, cam.lon);
      if(d <= CCTV_AUTO_SHOW_RADIUS_KM && d < nearestDist){
        nearest = cam;
        nearestDist = d;
      }
    }

    if(nearest){
      // 範圍內有監視器,且還沒顯示這一支的畫面,就自動切換過去
      if(window.cctvActiveCameraId !== nearest.id){
        const label = window.buildCctvLabel ? window.buildCctvLabel(nearest) : (nearest.road + " " + nearest.mile);
        window.switchCctvCamera(nearest.url, label, nearest.id, true);
      }
    } else {
      // 範圍外:如果目前顯示的是「自動觸發」開的,就自動關閉;手動點開的維持不動
      if(window.cctvActiveCameraId && window.cctvActiveIsAuto){
        window.closeCctvOverlay();
      }
    }
  }

  // ===== 🔊 測速照相語音播報 =====
  const SPEED_CAM_WARN_KM = 0.1;   // 100公尺:預告
  const SPEED_CAM_PASS_KM = 0.02;  // 20公尺:視為已經通過
  const SPEED_CAM_RESET_KM = 0.15; // 離開這個範圍才重置狀態,讓下一次經過可以再次播報
  const speedCameraVoiceState = {}; // key: 該支測速照相在陣列裡的索引

  function speakText(text){
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel(); // 避免播報堆疊、搶話
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 1.00;
      window.speechSynthesis.speak(utter);
    } catch(e) {
      console.error('語音播報失敗:', e);
    }
  }

  // 分段播放,段落之間用setTimeout插入真正1秒的靜音停頓,不依賴標點符號
  function speakSegments(segments){
    if (!('speechSynthesis' in window)) return;
    const list = segments.filter(s => s && s.length > 0);
    if (!list.length) return;

    window.speechSynthesis.cancel(); // 避免播報堆疊、搶話

    function playAt(i){
      if (i >= list.length) return;
      const utter = new SpeechSynthesisUtterance(list[i]);
      utter.lang = 'zh-TW';
      utter.rate = 1.00;
      utter.onend = () => {
        if (i + 1 < list.length) {
          setTimeout(() => playAt(i + 1), 250); // 真正的0.25秒停頓
        }
      };
      window.speechSynthesis.speak(utter);
    }
    playAt(0);
  }

  // ===== 🔍 搜尋地點(地理編碼,用OpenStreetMap的Nominatim服務,免費不用API金鑰)=====
  let destMarker = null;
  let selectedDest = null; // { lat, lon, name, addr }

  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const searchResultsList = document.getElementById('searchResultsList');
  const destPanel = document.getElementById('destPanel');
  const destName = document.getElementById('destName');
  const destAddr = document.getElementById('destAddr');
  const navigateBtn = document.getElementById('navigateBtn');
  const closeDestBtn = document.getElementById('closeDestBtn');

  async function searchPlaces(query){
    if (!query || !query.trim()) return;
    searchResultsList.innerHTML = '<div class="searchResultsEmpty">搜尋中...</div>';
    searchResultsList.style.display = 'block';
    try {
      const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=8&countrycodes=tw&accept-language=zh-TW&q=' + encodeURIComponent(query);
      const res = await fetch(url);
      const list = await res.json();
      renderSearchResults(list);
    } catch (e) {
      console.error('搜尋地點失敗:', e);
      searchResultsList.innerHTML = '<div class="searchResultsEmpty">搜尋失敗,請檢查網路連線</div>';
    }
  }

  function renderSearchResults(list){
    if (!list || !list.length) {
      searchResultsList.innerHTML = '<div class="searchResultsEmpty">找不到符合的地點</div>';
      return;
    }
    searchResultsList.innerHTML = '';
    list.forEach(item => {
      const el = document.createElement('div');
      el.className = 'searchResultItem';
      const mainName = (item.display_name || '').split(',')[0];
      el.innerHTML = '<div class="name">' + mainName + '</div><div class="addr">' + (item.display_name || '') + '</div>';
      el.addEventListener('click', () => {
        selectDestination(parseFloat(item.lat), parseFloat(item.lon), mainName, item.display_name);
      });
      searchResultsList.appendChild(el);
    });
  }

  function selectDestination(lat, lon, name, addr){
    selectedDest = { lat, lon, name, addr };

    if (destMarker) destMarker.remove();
    const el = document.createElement('div');
    el.style.width = '28px';
    el.style.height = '28px';
    el.style.borderRadius = '50% 50% 50% 0';
    el.style.background = '#2F80FF';
    el.style.border = '3px solid #FFFFFF';
    el.style.boxShadow = '0 2px 5px rgba(0,0,0,0.4)';
    el.style.transform = 'rotate(-45deg)';
    destMarker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat([lon, lat])
      .addTo(map);

    map.easeTo({ center: [lon, lat], zoom: 15, duration: 800 });

    searchResultsList.style.display = 'none';
    destName.innerText = name || '選定地點';
    destAddr.innerText = addr || '';
    destPanel.style.display = 'block';
  }

  if (searchBtn) {
    searchBtn.addEventListener('click', () => searchPlaces(searchInput.value));
  }
  if (searchInput) {
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchPlaces(searchInput.value);
    });
  }
  if (closeDestBtn) {
    closeDestBtn.addEventListener('click', () => {
      destPanel.style.display = 'none';
      if (destMarker) { destMarker.remove(); destMarker = null; }
      selectedDest = null;
    });
  }

  // ===== 🧭 真實路線規劃(用OSRM路徑引擎,免費公開服務,沿實際道路規劃路線)=====
  let plannedRouteCoordinates = [];

  // ===== 🧭 逐步轉彎導航狀態 =====
  let isNavigating = false;
  let navSteps = [];
  let currentStepIndex = 0;
  const navStepVoiceState = {}; // key: 步驟索引, value: idle/warned200/warned30

  const rect8 = document.getElementById('rect8');
  const rect8Icon = document.getElementById('rect8Icon');
  const rect8Instruction = document.getElementById('rect8Instruction');
  const rect8Distance = document.getElementById('rect8Distance');
  const searchBarWrapEl = document.getElementById('searchBarWrap');

  // 把OSRM的英文轉彎類型/修飾詞,轉成中文播報用文字
  function bindTurnByTurnTestButton(){
    const btn = document.getElementById('turnByTurnTestBtn');
    if (btn) {
      btn.addEventListener('click', () => {
        if (typeof window.testTurnByTurnVoice === 'function') {
          window.testTurnByTurnVoice();
        }
      });
    }
  }

  function maneuverToChinese(maneuver){
    const modMap = {
      'left':'左轉','right':'右轉',
      'slight left':'靠左行駛','slight right':'靠右行駛',
      'sharp left':'大幅左轉','sharp right':'大幅右轉',
      'straight':'直行','uturn':'迴轉'
    };
    if (maneuver.type === 'depart') return '出發';
    if (maneuver.type === 'arrive') return '即將到達目的地';
    if (maneuver.type === 'roundabout' || maneuver.type === 'rotary') return '進入圓環';
    if (maneuver.type === 'merge') return '匯入車流';
    if (maneuver.type === 'fork') return '請靠' + (maneuver.modifier && maneuver.modifier.includes('left') ? '左' : '右') + '行駛';
    if (maneuver.type === 'end of road') return '路底' + (maneuver.modifier && modMap[maneuver.modifier] ? modMap[maneuver.modifier] : '轉彎');
    if (maneuver.type === 'continue' || maneuver.type === 'new name') return '繼續直行';
    if (maneuver.modifier && modMap[maneuver.modifier]) return modMap[maneuver.modifier];
    return '繼續前進';
  }

  // 轉彎方向對應的箭頭圖示
  function iconForManeuver(maneuver){
    if (maneuver.type === 'depart') return '🚗';
    if (maneuver.type === 'arrive') return '🏁';
    const mod = maneuver.modifier || '';
    if (mod.includes('sharp left')) return '↰';
    if (mod.includes('sharp right')) return '↱';
    if (mod.includes('left')) return '↖';
    if (mod.includes('right')) return '↗';
    if (mod === 'uturn') return '↩';
    return '↑';
  }

  // 更新Rectangle 8畫面顯示(圖示+距離+轉彎指示文字)
  function updateRect8Display(distanceMeters){
    if (!rect8 || !navSteps.length || currentStepIndex >= navSteps.length) return;
    const step = navSteps[currentStepIndex];
    if (!step) return;
    const text = maneuverToChinese(step.maneuver);
    const roadName = step.name ? ('進入' + step.name) : '';
    if (rect8Instruction) rect8Instruction.innerText = text + (roadName ? roadName : '');
    if (rect8Icon) rect8Icon.innerText = iconForManeuver(step.maneuver);
    if (rect8Distance) {
      rect8Distance.innerText = (distanceMeters != null) ? (Math.round(distanceMeters) + '公尺後') : '';
    }
  }

  // GPS每次更新時呼叫:算出離下一個轉彎點多遠,更新畫面跟語音播報
  function checkTurnByTurn(lat, lon){
    if (!isNavigating || !navSteps.length) return;
    if (currentStepIndex >= navSteps.length) {
      isNavigating = false;
      return;
    }
    const step = navSteps[currentStepIndex];
    const loc = step.maneuver.location; // [lon, lat]
    const meters = calculateDistance(lat, lon, loc[1], loc[0]) * 1000;
    const isDepart = (step.maneuver.type === 'depart');

    updateRect8Display(meters);

    // ===== 🚨 偏航偵測 =====
    checkOffRoute(lat, lon);

    const state = navStepVoiceState[currentStepIndex] || 'idle';
    const text = maneuverToChinese(step.maneuver);
    const roadPart = step.name ? ('進入' + step.name) : '';

    console.log('[轉彎導航] 第' + currentStepIndex + '步,距離' + Math.round(meters) + '公尺,狀態:' + state + ',指示:' + text);

    // 由近到遠檢查(順序很重要),避免GPS更新間隔太大時整個跳過播報門檻
    if (meters <= 15) {
      // 出發點本身不用播報,直接靜默前進到第一個真正的轉彎
      if (!isDepart && state !== 'warned30' && state !== 'passed') {
        speakText('請' + text + roadPart);
      }
      currentStepIndex++;
      navStepVoiceState[currentStepIndex] = navStepVoiceState[currentStepIndex] || 'idle';
      if (currentStepIndex >= navSteps.length) {
        isNavigating = false;
        if (rect8) rect8.style.display = 'none';
        if (searchBarWrapEl) searchBarWrapEl.style.display = '';
        togglePoiLayers(true); // 恢復POI地標
        speakText('您已到達目的地');
      } else {
        updateRect8Display();
      }
    } else if (meters <= 30 && !isDepart && state !== 'warned30') {
      speakText('請' + text + roadPart);
      navStepVoiceState[currentStepIndex] = 'warned30';
    } else if (meters <= 200 && !isDepart && state === 'idle') {
      speakText('前方' + (Math.max(10, Math.round(meters / 10) * 10)) + '公尺' + text + roadPart);
      navStepVoiceState[currentStepIndex] = 'warned200';
    }
  }

  // ===== 🚨 偏航偵測與重新規劃 =====
  let offRouteCount = 0;          // 連續偏航偵測次數
  let isRerouting = false;        // 是否正在重新規劃中
  const OFF_ROUTE_THRESHOLD = 50; // 距路線超過50公尺視為偏航
  const OFF_ROUTE_CONFIRM = 3;    // 連續3次GPS更新都偏航才確認

  function checkOffRoute(lat, lon) {
    if (!isNavigating || isRerouting || !window.plannedRouteCoordinates) return;

    // 計算使用者目前位置距離規劃路線上最近點的距離
    const minDist = getMinDistanceToRoute(lat, lon, window.plannedRouteCoordinates);

    if (minDist > OFF_ROUTE_THRESHOLD) {
      offRouteCount++;
      console.log('[偏航] 距路線' + Math.round(minDist) + '公尺,連續' + offRouteCount + '次');

      if (offRouteCount >= OFF_ROUTE_CONFIRM) {
        // 確認偏航，開始重新規劃
        offRouteCount = 0;
        triggerReroute(lat, lon);
      }
    } else {
      // 回到路線上，重置計數
      offRouteCount = 0;
    }
  }

  // 計算使用者位置到路線上最近點的距離(公尺)
  function getMinDistanceToRoute(lat, lon, routeCoords) {
    let minDist = Infinity;
    for (const coord of routeCoords) {
      const d = calculateDistance(lat, lon, coord[1], coord[0]) * 1000;
      if (d < minDist) minDist = d;
    }
    return minDist;
  }

  // 觸發重新規劃路線
  async function triggerReroute(lat, lon) {
    if (isRerouting || !selectedDest) return;
    isRerouting = true;

    speakText('您已偏航,正在重新規劃路線');

    if (rect8) {
      rect8Instruction.innerText = '重新規劃路線中...';
      rect8Icon.innerText = '🔄';
      rect8Distance.innerText = '';
    }

    try {
      await planRouteTo(selectedDest.lat, selectedDest.lon, { lat, lon });
      speakText('路線已重新規劃');
    } catch (e) {
      console.error('[偏航] 重新規劃失敗:', e);
      speakText('重新規劃失敗，請手動搜尋目的地');
    } finally {
      isRerouting = false;
    }
  }

  // ===== 🧪 測試用:不用真的開車,直接在主控台或測試面板模擬播報 =====
  window.testTurnByTurnVoice = function(){
    if (!navSteps.length) {
      // 還沒有規劃路線時,先用假資料測試語音機制本身有沒有作用
      speakText('前方一百公尺,請左轉,進入測試路');
      console.log('[轉彎語音測試] 目前沒有規劃中的路線,改用假資料測試語音機制本身');
      return;
    }
    const step = navSteps[Math.min(1, navSteps.length - 1)]; // 抓第一個真正的轉彎(跳過出發點)
    const text = maneuverToChinese(step.maneuver);
    const roadPart = step.name ? ('進入' + step.name) : '';
    speakText('前方100公尺' + text + roadPart);
  };
  bindTurnByTurnTestButton();


  // 導航時隱藏/恢復POI地標圖層
  function togglePoiLayers(show) {
    const visibility = show ? 'visible' : 'none';
    const style = map.getStyle();
    if (!style || !style.layers) return;
    style.layers.forEach(layer => {
      // 隱藏所有 symbol 類型圖層（包含 POI marker、地名、圖示）
      // 只保留 line（道路）、fill（區域填色）、background
      if (layer.type === 'symbol') {
        try {
          map.setLayoutProperty(layer.id, 'visibility', visibility);
        } catch(e) {}
      }
    });
  }

  // 螢幕高度算出來的鏡頭偏移,讓定位點顯示在畫面中下方、Rectangle 4正上方,而不是螢幕正中央
  function getUserCameraPadding(){
    const H = window.innerHeight || 800;
    const OFFSET_FROM_BOTTOM = 240; // rect4頂端距螢幕底部約209px,這裡抓240px留一點間距
    const T = Math.max(0, H - 2 * OFFSET_FROM_BOTTOM);
    return { top: T, bottom: 0, left: 0, right: 0 };
  }

  // ===== 🧭 手機羅盤方向偵測,讓地圖跟著手機旋轉(360度)而不是固定北方朝上 =====
  window.compassHeading = null;

  function handleDeviceOrientation(event){
    let heading = null;
    if (typeof event.webkitCompassHeading === 'number') {
      heading = event.webkitCompassHeading;
    } else if (typeof event.alpha === 'number') {
      heading = 360 - event.alpha;
    }
    if (heading != null && !isNaN(heading)) {
      window.compassHeading = heading;
      updateUserMarkerHeading(); // 同步更新車子圖示方向
    }
  }

  function requestOrientationPermission(){
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS 13+ 需要使用者手勢觸發才能要求羅盤權限
      DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') {
          window.addEventListener('deviceorientationabsolute', handleDeviceOrientation, true);
          window.addEventListener('deviceorientation', handleDeviceOrientation, true);
        }
      }).catch(() => {});
    } else {
      window.addEventListener('deviceorientationabsolute', handleDeviceOrientation, true);
      window.addEventListener('deviceorientation', handleDeviceOrientation, true);
    }
  }
  document.addEventListener('click', requestOrientationPermission, { once: true });
  document.addEventListener('touchstart', requestOrientationPermission, { once: true });


  function getCurrentPositionPromise(){
    // 優先用已經在追蹤的GPS座標(window.currentLat/Lon),沒有的話現抓一次
    if (window.currentLat != null && window.currentLon != null) {
      return Promise.resolve({ lat: window.currentLat, lon: window.currentLon });
    }
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error('瀏覽器不支援定位')); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        (err) => reject(err)
      );
    });
  }

  async function planRouteTo(destLat, destLon, fromPosition = null){
    let origin;
    try {
      if (fromPosition) {
        // 偏航重新規劃：直接用傳入的GPS位置當起點，不用重新取得
        origin = { lat: fromPosition.lat, lon: fromPosition.lon };
      } else {
        origin = await getCurrentPositionPromise();
      }
    } catch (e) {
      alert('無法取得目前位置,請確認已允許定位權限');
      return;
    }

    if (!fromPosition) {
      // 正常導航才更新按鈕狀態
      navigateBtn.disabled = true;
      navigateBtn.innerText = '規劃路線中...';
    }

    try {
      const url = 'https://router.project-osrm.org/route/v1/driving/' +
        origin.lon + ',' + origin.lat + ';' + destLon + ',' + destLat +
        '?overview=full&geometries=geojson&steps=true';
      const res = await fetch(url);
      const data = await res.json();

      if (!data.routes || !data.routes.length) {
        alert('找不到可行的路線');
        return;
      }

      const route = data.routes[0];
      plannedRouteCoordinates = route.geometry.coordinates;
      window.plannedRouteCoordinates = plannedRouteCoordinates;

      if (window.navRouteSource) {
        window.navRouteSource.setData({
          type: 'FeatureCollection',
          features: [{ type: 'Feature', geometry: route.geometry }]
        });
      }

      // 更新底部面板的時間/距離/到達時間顯示
      const durationMin = Math.round(route.duration / 60);
      const distanceKm = (route.distance / 1000).toFixed(1);
      const infoEl = document.querySelector('.info');
      if (infoEl) {
        const h = Math.floor(durationMin / 60);
        const m = durationMin % 60;
        infoEl.innerText = (h > 0 ? h + '小時' : '') + m + '分鐘 ' + distanceKm + '公里';
      }
      const arrivalEl = document.getElementById('arrivalText');
      if (arrivalEl) {
        const eta = new Date(Date.now() + route.duration * 1000);
        const hh = String(eta.getHours()).padStart(2, '0');
        const mm = String(eta.getMinutes()).padStart(2, '0');
        arrivalEl.innerText = hh + ':' + mm + '到達';
      }

      // 縮放地圖顯示整條路線
      const lons = plannedRouteCoordinates.map(c => c[0]);
      const lats = plannedRouteCoordinates.map(c => c[1]);
      const bounds = [
        [Math.min(...lons), Math.min(...lats)],
        [Math.max(...lons), Math.max(...lats)]
      ];
      map.fitBounds(bounds, { padding: 80, duration: 800 });

      destPanel.style.display = 'none';

      // ===== 🧭 啟動逐步轉彎導航模式 =====
      navSteps = (route.legs && route.legs[0] && route.legs[0].steps) ? route.legs[0].steps : [];
      currentStepIndex = 0;
      Object.keys(navStepVoiceState).forEach(k => delete navStepVoiceState[k]);
      isNavigating = true;
      if (searchBarWrapEl) searchBarWrapEl.style.display = 'none';
      if (rect8) rect8.style.display = 'flex';
      updateRect8Display();
      togglePoiLayers(false); // 導航時隱藏POI地標

      // 開始導航時播報全程距離跟預估時間,並直接帶出第一個轉彎指示(不用等GPS靠近才講)
      const startH = Math.floor(durationMin / 60);
      const startM = durationMin % 60;
      let startupText = '開始導航,全程' + distanceKm + '公里,大約需要';
      if (startH > 0) startupText += startH + '小時';
      startupText += startM + '分鐘';

      // 加上預計到達時間
      const startupEta = new Date(Date.now() + route.duration * 1000);
      const startupEtaH = startupEta.getHours();
      const startupEtaM = startupEta.getMinutes();
      startupText += ',預計' + startupEtaH + '點' + startupEtaM + '分到達';

      // 找出第一個真正的轉彎(跳過出發點depart),把指示一併講出來
      const firstTurnIndex = navSteps.findIndex(s => s.maneuver && s.maneuver.type !== 'depart');
      if (firstTurnIndex !== -1) {
        const firstStep = navSteps[firstTurnIndex];
        const firstText = maneuverToChinese(firstStep.maneuver);
        const firstRoadPart = firstStep.name ? ('進入' + firstStep.name) : '';
        // 用上一步(通常是出發點)的距離,算出離第一個轉彎還有多遠
        const prevStep = navSteps[firstTurnIndex - 1];
        const firstStepDistanceMeters = prevStep ? prevStep.distance : null;
        if (firstStepDistanceMeters != null) {
          const meters = Math.max(10, Math.round(firstStepDistanceMeters / 10) * 10);
          startupText += ',前方' + meters + '公尺' + firstText + firstRoadPart;
        } else {
          startupText += ',' + firstText + firstRoadPart;
        }
        // 標記這一步已經播報過,避免GPS之後在200公尺/30公尺門檻又重複講一次
        currentStepIndex = firstTurnIndex;
        navStepVoiceState[firstTurnIndex] = 'warned200';
        updateRect8Display(firstStepDistanceMeters);
      }

      speakText(startupText);

      // 先讓使用者看一眼整條路線的鳥瞰圖,1.8秒後自動拉近到正常導航視角,不然會一直停在縮小狀態看不清楚路
      setTimeout(() => {
        if (!isNavigating) return; // 如果這段時間使用者已經退出導航,就不要再拉近
        map.easeTo({
          center: [origin.lon, origin.lat],
          zoom: 17,
          duration: 1200,
          padding: getUserCameraPadding(),
          bearing: (window.compassHeading != null ? window.compassHeading : 0)
        });
      }, 1800);
    } catch (e) {
      console.error('路線規劃失敗:', e);
      if (!fromPosition) alert('路線規劃失敗,請檢查網路連線');
    } finally {
      if (!fromPosition) {
        navigateBtn.disabled = false;
        navigateBtn.innerText = '開始導航';
      }
    }
  }

  if (navigateBtn) {
    navigateBtn.addEventListener('click', () => {
      if (!selectedDest) return;
      planRouteTo(selectedDest.lat, selectedDest.lon);
    });
  }

  // 全覽按鈕也要考慮目前是否有規劃中的真實導航路線(優先顯示這個,而不是GPS軌跡)
  window.plannedRouteCoordinates = plannedRouteCoordinates;

  function checkSpeedCameraVoice(lat, lon, currentSpeedKmh){
    const data = window.speedCameraData;
    if (!data || !data.features) return;

    data.features.forEach((f, idx) => {
      const [camLon, camLat] = f.geometry.coordinates;
      const p = f.properties;
      const d = calculateDistance(lat, lon, camLat, camLon); // 公里

      const state = speedCameraVoiceState[idx] || 'idle';

      if (d <= SPEED_CAM_WARN_KM && state === 'idle') {
        // 進入100公尺範圍,第一次播報預告(距離用實際算出來的,不是寫死100)
        const limit = p.limit;
        const meters = Math.max(10, Math.round((d * 1000) / 10) * 10); // 四捨五入到最近10公尺,且最少講10公尺
        const isOverSpeed = !!(currentSpeedKmh && limit && currentSpeedKmh > Number(limit));
        let text = '前方' + meters + '公尺後有固定測速照相';
        if (limit) text += '限速' + limit + '公里';
        if (isOverSpeed) text += '您已超速';
        speakText(text);
        speedCameraVoiceState[idx] = 'warned';

      } else if (d <= SPEED_CAM_PASS_KM && state === 'warned') {
        // 已經很靠近,視為通過,播報一次「通過」
        speakText('通過測速照相');
        speedCameraVoiceState[idx] = 'passed';

      } else if (d > SPEED_CAM_RESET_KM && state !== 'idle') {
        // 離開範圍夠遠,重置狀態,讓之後再經過同一支時還能再播報
        speedCameraVoiceState[idx] = 'idle';
      }
    });
  }

  // ===== 🧪 測試用:在瀏覽器主控台手動模擬,不用真的開車過去 =====
  // 用法範例(在 Console 貼上執行):
  //   window.testSpeedCameraVoice(24.778543, 121.75933, 70)
  //   參數:緯度, 經度, 模擬車速(km/h)
  window.testSpeedCameraVoice = function(lat, lon, speedKmh){
    checkSpeedCameraVoice(lat, lon, speedKmh || 0);
  };
  // 重置所有測速照相的播報狀態,方便重複測試同一支
  window.resetSpeedCameraVoiceState = function(){
    Object.keys(speedCameraVoiceState).forEach(k => delete speedCameraVoiceState[k]);
    console.log('已重置所有測速照相播報狀態');
  };
  // 直接測試語音功能本身有沒有作用(不牽涉座標距離判斷)
  window.testSpeak = function(text){
    speakText(text || '測試語音播報');
  };

  // ===== 🧪 固定用速限100的測速照相做測試,不管距離直接播報 =====
  // 注意:不要在這裡用 const 提前抓資料,因為這段程式碼可能比
  // window.speedCameraData 設定完成的時間點還早執行,提前抓只會抓到空值。
  // 改成每次需要時才即時查找。
  function getTestCamera(){
    const data = window.speedCameraData;
    if (!data || !data.features || !data.features.length) return null;
    // 優先找速限100的測速點,找不到就退回第一支
    const found = data.features.find(f => f.properties && f.properties.limit === '100');
    return found || data.features[0];
  }

  function forceTestSpeedCameraAnnounce(speedKmh, distanceMeters){
    const cam = getTestCamera();
    if (!cam) {
      console.warn('找不到測速照相測試資料(window.speedCameraData尚未準備好)');
      return;
    }
    const p = cam.properties;
    const limit = p.limit;
    const meters = (distanceMeters !== undefined && distanceMeters !== null && distanceMeters !== '')
      ? Math.round(Number(distanceMeters))
      : 100;
    const isOverSpeed = !!(speedKmh && limit && Number(speedKmh) > Number(limit));
    let text = '前方' + meters + '公尺後有固定測速照相';
    if (limit) text += '限速' + limit + '公里';
    if (isOverSpeed) text += '您已超速';
    speakText(text);
  }
  window.forceTestSpeedCameraAnnounce = forceTestSpeedCameraAnnounce;

  // 把測試面板接上按鈕跟資訊顯示
  (function initSpeedCamTestPanel(){
    const infoEl = document.getElementById('speedCamTestInfo');
    const speedInput = document.getElementById('speedCamTestSpeed');
    const distanceInput = document.getElementById('speedCamTestDistance');
    const useRealSpeedBtn = document.getElementById('speedCamUseRealSpeedBtn');
    const btn = document.getElementById('speedCamTestBtn');

    // 資料可能還沒準備好,定期重試更新顯示文字,抓到之後就停止重試
    function updateInfoText(){
      if (!infoEl) return false;
      const cam = getTestCamera();
      if (cam) {
        const p = cam.properties;
        infoEl.innerText = (p.address || '測試點') + '(速限' + (p.limit || '?') + ')';
        return true;
      } else {
        infoEl.innerText = '資料載入中...';
        return false;
      }
    }

    if (!updateInfoText()) {
      const retryTimer = setInterval(() => {
        if (updateInfoText()) clearInterval(retryTimer);
      }, 500);
    }

    if (btn) {
      btn.addEventListener('click', () => {
        const speedKmh = speedInput ? Number(speedInput.value) : 0;
        const distanceMeters = distanceInput ? Number(distanceInput.value) : 100;
        forceTestSpeedCameraAnnounce(speedKmh, distanceMeters);
      });
    }

    if (useRealSpeedBtn) {
      useRealSpeedBtn.addEventListener('click', () => {
        const real = window.currentSpeedKmh;
        if (real === undefined || real === null) {
          alert('還沒有取得GPS車速,請先確認定位已經開始');
          return;
        }
        if (speedInput) speedInput.value = Math.round(real);
      });
    }
  })();



  function formatTime(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    return `${hours}小時${minutes}分鐘`;
  }

  function updateDisplay(speed, elapsedMs) {
    if (window.simRunning) return;   // sim 已接管速度計
    rect6SpeedValue.innerText = Math.round(speed);
    // 導航中(已經規劃好真實路線)時,.info要顯示「全程距離/時間」,
    // 不能被這裡的GPS行程記錄(從0開始算)覆蓋掉
    if (!isNavigating) {
      infoElement.innerText = `${formatTime(elapsedMs)} ${totalDistance.toFixed(2)}公里`;
    }
  }

  // ===== 平滑移動定位點(用動畫插值,不要瞬間跳轉) =====
  let markerAnimFrame = null;
  let markerDisplayLngLat = null; // 目前畫面上實際顯示的位置(動畫的起點)

  function animateMarkerTo(targetLng, targetLat, duration){
    if(!marker) return;

    // 第一次還沒有起點位置時,直接定位過去,不需要動畫
    if(!markerDisplayLngLat){
      markerDisplayLngLat = [targetLng, targetLat];
      marker.setLngLat(markerDisplayLngLat);
      return;
    }

    const startLng = markerDisplayLngLat[0];
    const startLat = markerDisplayLngLat[1];
    const startTimeMs = performance.now();

    if(markerAnimFrame){
      cancelAnimationFrame(markerAnimFrame);
    }

    function step(){
      const elapsed = performance.now() - startTimeMs;
      const t = Math.min(1, elapsed / duration);
      // easeOutCubic,讓移動有自然的減速感,不會死板地等速移動
      const eased = 1 - Math.pow(1 - t, 3);

      const lng = startLng + (targetLng - startLng) * eased;
      const lat = startLat + (targetLat - startLat) * eased;

      markerDisplayLngLat = [lng, lat];
      marker.setLngLat(markerDisplayLngLat);

      if(t < 1){
        markerAnimFrame = requestAnimationFrame(step);
      }
    }

    markerAnimFrame = requestAnimationFrame(step);
  }

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition((pos) => {
      const now = Date.now();
      const currentLat = pos.coords.latitude;
      const currentLon = pos.coords.longitude;
      const currentSpeed = pos.coords.speed || 0;

      if (!startTime) {
        startTime = now;
        lastPosition = { lat: currentLat, lon: currentLon };
        routeCoordinates = [[currentLon, currentLat]];
      }

      if (lastPosition) {
        const distance = calculateDistance(lastPosition.lat, lastPosition.lon, currentLat, currentLon);
        totalDistance += distance;
        lastPosition = { lat: currentLat, lon: currentLon };
      }

      if (lastPosition) {
        const d = calculateDistance(lastPosition.lat, lastPosition.lon, currentLat, currentLon);
        if (d > 0.005) {
          routeCoordinates.push([currentLon, currentLat]);
        }
      }

      if (routeSource) {
        routeSource.setData({
          type: 'FeatureCollection',
          features: [{
            type: 'Feature',
            geometry: {
              type: 'LineString',
              coordinates: routeCoordinates
            }
          }]
        });
      }

      if (followUser) {
        map.easeTo({
          center: [currentLon, currentLat],
          zoom: 15,
          duration: 1000,
          padding: getUserCameraPadding(),
          bearing: (window.compassHeading != null ? window.compassHeading : 0)
        });
      }

      if (typeof checkTurnByTurn === 'function') {
        checkTurnByTurn(currentLat, currentLon);
      }

      if (!marker) {
        const el = document.createElement('div');
        el.style.width = '20px';
        el.style.height = '20px';
        el.style.backgroundColor = '#3b82f6';
        el.style.borderRadius = '50%';
        el.style.border = '2px solid white';
        el.style.boxShadow = '0 2px 4px rgba(0,0,0,0.3)';

        marker = new maplibregl.Marker(el).setLngLat([currentLon, currentLat]).addTo(map);
        markerDisplayLngLat = [currentLon, currentLat];
      } else {
        // 用 1 秒的平滑動畫移動過去,而不是瞬間跳轉到新座標
        animateMarkerTo(currentLon, currentLat, 1000);
      }

      const elapsedMs = now - startTime;
      const speedKmh = currentSpeed * 3.6;
      window.currentSpeedKmh = speedKmh; // 讓測試面板可以讀取目前真實車速
      window.currentLat = currentLat; // 讓搜尋導航功能可以取得目前位置
      window.currentLon = currentLon;

      updateDisplay(speedKmh, elapsedMs);
      requestRoadNameUpdate(currentLon, currentLat);

      // 定位經過監視器附近時自動顯示彈出視窗
      checkCctvProximity(currentLat, currentLon);

      // 測速照相語音播報(接近100公尺預告、超速警示、通過播報)
      checkSpeedCameraVoice(currentLat, currentLon, speedKmh);

    }, (err) => {
      console.error('GPS error:', err);
      if (!window.simRunning) {
        rect6SpeedValue.innerText = '×';
        rect6SpeedUnit.innerText = 'GPS';
      }
    }, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 10000
    });
  } else {
    alert('您的瀏覽器不支援地理定位功能');
  }
</script>

<script>

  // 更新車子圖示的旋轉方向

<script>
// ===== 🛣️ 道路名稱查詢節流控制 =====
// Overpass API 是公開免費服務,太頻繁查詢容易被限流/擋掉,
// 所以這裡限制「最快幾秒才能查一次」,而且同一時間只允許一個請求在跑。
const ROAD_NAME_MIN_INTERVAL_MS = 8000;
let roadNameLastFetchAt = 0;
let roadNameInFlight = false;
let roadNamePendingCoords = null;
let roadNameRequestSeq = 0;       // 用來判斷回應是不是過期的(避免舊請求晚回來蓋掉新結果)
let roadNameLatestAppliedSeq = 0;

function requestRoadNameUpdate(lng, lat){
  const now = Date.now();

  if(roadNameInFlight){
    // 已經有請求在跑,先記住最新位置,等目前這次查完再用最新的位置補查一次
    roadNamePendingCoords = [lng, lat];
    return;
  }

  if(now - roadNameLastFetchAt < ROAD_NAME_MIN_INTERVAL_MS){
    // 還沒到可以再查的時間,先記住最新位置,時間到了會自動補查
    roadNamePendingCoords = [lng, lat];
    return;
  }

  roadNamePendingCoords = null;
  roadNameLastFetchAt = now;
  roadNameInFlight = true;

  const mySeq = ++roadNameRequestSeq;

  updateRoadName(lng, lat, mySeq).finally(() => {
    roadNameInFlight = false;
    // 查詢期間如果定位又更新了,用最新的位置立刻補查一次
    if(roadNamePendingCoords){
      const [pLng, pLat] = roadNamePendingCoords;
      roadNamePendingCoords = null;
      requestRoadNameUpdate(pLng, pLat);
    }
  });
}

async function updateRoadName(lng, lat, seq){
  try{
    const R = 6371e3;
    const toRad = Math.PI / 180;

    function getDistance(lat1, lon1, lat2, lon2){
      const dLat = (lat2 - lat1) * toRad;
      const dLon = (lon2 - lon1) * toRad;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*toRad)*Math.cos(lat2*toRad)*Math.sin(dLon/2)**2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    const query = `
    [out:json];
    way(around:10,${lat},${lng})["highway"]["name"];
    out center;
    `;

    // 加上逾時保護,避免Overpass反應太慢時卡住,一直占用「目前有請求在跑」的狀態
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 6000);

    let res;
    try{
      res = await fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        body: query,
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeoutId);
    }

    if(!res.ok){
      console.log("road name http error", res.status);
      return;
    }

    const data = await res.json();

    // 如果在等待回應的這段時間,已經有更新的請求送出去了,這次的結果就是過期的,不要套用
    if(seq < roadNameLatestAppliedSeq) return;

    let best = "未知道路";
    let min = Infinity;
    let bestTags = null;

    if(data.elements){
      for(const el of data.elements){
        if(!el.center || !el.tags?.name) continue;

        const d = getDistance(lat, lng, el.center.lat, el.center.lon);

        if(d < min){
          min = d;
          best = el.tags.name;
          bestTags = el.tags;
        }
      }
    }

    let isFreeway = false;

    if(bestTags){
      const hw = bestTags.highway || "";
      const ref = bestTags.ref || "";
      const name = bestTags.name || "";

      isFreeway =
        (hw === "motorway" && ref.includes("3")) ||
        name.includes("國道3") ||
        name.includes("國道三") ||
        name.includes("福爾摩沙");
    }

    roadNameLatestAppliedSeq = seq;

    const label = document.getElementById("roadLabel");
    const icon = document.querySelector(".rect4 .icon");

    if(label) label.innerText = best;

    if(icon){
      icon.style.display = isFreeway ? "block" : "none";
    }

  }catch(e){
    console.log("road name error", e);
  }
}
</script>

<script>
document.addEventListener("DOMContentLoaded", function(){

  // ===== 📷 CCTV 即時影像:置中彈出視窗,定期自動重新連線避免串流斷掉後畫面卡住 =====
  const cctvImage = document.getElementById("cctvImage");
  const cctvStatus = document.getElementById("cctvStatus");
  const cctvOverlay = document.getElementById("cctvOverlay");
  const cctvPanelTitle = document.getElementById("cctvPanelTitle");
  let CCTV_BASE_URL = "";
  let CCTV_CURRENT_LABEL = "";
  const CCTV_REFRESH_INTERVAL = 8000; // 每 8 秒主動重新連線一次

  let cctvReloadTimer = null;

  function scheduleCctvReload(delay){
    // 只用一個計時器,排新的之前先取消舊的,避免兩個重連動作互相打架
    if(cctvReloadTimer){
      clearTimeout(cctvReloadTimer);
    }
    cctvReloadTimer = setTimeout(reloadCctvImage, delay);
  }

  function reloadCctvImage(){
    if(!cctvImage || !CCTV_BASE_URL) return;
    cctvImage.src = CCTV_BASE_URL + "&_t=" + Date.now();
    // 每次重連之後,重新排下一次的定期重連(不管這次是正常排程還是錯誤觸發的)
    scheduleCctvReload(CCTV_REFRESH_INTERVAL);
  }

  // 切換到地圖上點選的某一支監視器,並打開置中彈出視窗
  // camId: 該監視器的 id(用於追蹤目前顯示中的是哪一支,避免重複觸發)
  // isAuto: true 代表是「定位經過自動顯示」觸發的,false 代表是手動點擊圖示觸發的
  window.switchCctvCamera = function(url, label, camId, isAuto){
    CCTV_BASE_URL = url;
    CCTV_CURRENT_LABEL = label;
    if(cctvPanelTitle) cctvPanelTitle.textContent = "📷 " + label;
    if(cctvOverlay) cctvOverlay.classList.add("show");
    window.cctvActiveCameraId = camId || null;
    window.cctvActiveIsAuto = !!isAuto;
    reloadCctvImage();
  };

  // 關閉彈出視窗時,停止重連計時器,避免在背景一直跑浪費效能
  window.closeCctvOverlay = function(){
    if(cctvOverlay) cctvOverlay.classList.remove("show");
    if(cctvReloadTimer){
      clearTimeout(cctvReloadTimer);
      cctvReloadTimer = null;
    }
    CCTV_BASE_URL = "";
    window.cctvActiveCameraId = null;
    window.cctvActiveIsAuto = false;
  };

  // ===== 🖱️ 讓彈出視窗可以拖動(抓標題列當把手,滑鼠/觸控都支援) =====
  if(cctvOverlay && cctvPanelTitle){
    let dragStartX = 0;
    let dragStartY = 0;
    let overlayStartLeft = 0;
    let overlayStartTop = 0;
    let dragging = false;

    function getPointerXY(e){
      if(e.touches && e.touches.length){
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function startDrag(e){
      dragging = true;
      const rect = cctvOverlay.getBoundingClientRect();
      // 第一次拖動時,把定位從「置中公式」換成固定的像素座標,之後才能用 left/top 自由移動
      cctvOverlay.style.left = rect.left + "px";
      cctvOverlay.style.top = rect.top + "px";
      cctvOverlay.style.transform = "none";

      overlayStartLeft = rect.left;
      overlayStartTop = rect.top;

      const p = getPointerXY(e);
      dragStartX = p.x;
      dragStartY = p.y;

      e.preventDefault();
    }

    function onDragMove(e){
      if(!dragging) return;
      const p = getPointerXY(e);
      const dx = p.x - dragStartX;
      const dy = p.y - dragStartY;
      cctvOverlay.style.left = (overlayStartLeft + dx) + "px";
      cctvOverlay.style.top = (overlayStartTop + dy) + "px";
    }

    function stopDrag(){
      dragging = false;
    }

    cctvPanelTitle.addEventListener("mousedown", startDrag);
    cctvPanelTitle.addEventListener("touchstart", startDrag, { passive: false });

    document.addEventListener("mousemove", onDragMove);
    document.addEventListener("touchmove", onDragMove, { passive: false });

    document.addEventListener("mouseup", stopDrag);
    document.addEventListener("touchend", stopDrag);
  }

  if(cctvImage){
    cctvImage.addEventListener("load", function(){
      if(cctvStatus) cctvStatus.textContent = CCTV_CURRENT_LABEL;
    });

    cctvImage.addEventListener("error", function(){
      if(cctvStatus) cctvStatus.textContent = "影像連線中斷,正在重新連線...";
      // 斷線時提前重連,並取消原本排定的那一次,避免兩邊同時觸發
      scheduleCctvReload(3000);
    });
  }
});
</script>


<script>
// ===== 🌩️ 中央氣象署(CWA)天氣特報 =====
// W-C0033-001:各縣市天氣特報。用使用者目前位置反查所在縣市,
// 該縣市有生效中的特報時,在地圖上方顯示紅色橫幅提醒。
//
// 注意:CWA_AUTH_KEY 是 CWA 開放資料平台的個人金鑰,直接寫在前端(不像 TDX
// 需要 OAuth2 client_secret 那樣機密),但因為這個 repo 是公開的 GitHub repo,
// 任何人都看得到這把 key、也可能被拿去用掉你的請求額度。如果介意的話之後可以
// 比照 TDX 的做法,改成用後端代理包起來。
const CWA_AUTH_KEY = "CWA-FFED18F8-F95F-423F-AA3E-5C18BDE89DA1";
const CWA_UPDATE_INTERVAL_MS = 5 * 60 * 1000; // 天氣特報不是秒級變化的資料,5分鐘查一次就夠
const weatherAlertEl = document.getElementById("weatherAlert");

let cwaWarningsByCounty = null; // { "臺北市": [{phenomena, significance, ...}], ... }
let lastKnownCounty = null;

// CWA 用「臺」,但 Nominatim 反查地址常常回「台」,比對前先統一寫法。
function normalizeCountyName(name){
  return (name || "").replace(/台/g, "臺");
}

async function fetchCwaWarnings(){
  try{
    const res = await fetch(`https://opendata.cwa.gov.tw/api/v1/rest/datastore/W-C0033-001?Authorization=${CWA_AUTH_KEY}`);
    if(!res.ok){
      console.log("CWA API http error", res.status);
      return;
    }
    const data = await res.json();
    const locations = data?.records?.location || [];

    const byCounty = {};
    for(const loc of locations){
      const hazards = loc?.hazardConditions?.hazards || [];
      if(hazards.length > 0){
        byCounty[normalizeCountyName(loc.locationName)] = hazards;
      }
    }
    cwaWarningsByCounty = byCounty;
    updateWeatherAlertDisplay();
  } catch(err){
    console.log("CWA fetch failed", err);
  }
}

async function updateCurrentCounty(lat, lng){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10&accept-language=zh-TW`);
    if(!res.ok) return;
    const data = await res.json();
    const addr = data?.address || {};
    const county = addr.county || addr.city || addr.state || null;
    if(county){
      lastKnownCounty = normalizeCountyName(county);
      updateWeatherAlertDisplay();
      if(typeof updateEarthquakeAlertDisplay === 'function') updateEarthquakeAlertDisplay();
    }
  } catch(err){
    console.log("reverse geocode (county) failed", err);
  }
}

function updateWeatherAlertDisplay(){
  if(!weatherAlertEl || !cwaWarningsByCounty || !lastKnownCounty){
    return;
  }

  const hazards = cwaWarningsByCounty[lastKnownCounty];
  if(!hazards || hazards.length === 0){
    weatherAlertEl.style.display = "none";
    return;
  }

  const text = hazards
    .map(h => `${h.phenomena || ""}${h.significance || ""}`)
    .join("、");

  weatherAlertEl.textContent = `⚠️ ${lastKnownCounty}${text}`;
  weatherAlertEl.style.display = "block";
}

fetchCwaWarnings();
setInterval(fetchCwaWarnings, CWA_UPDATE_INTERVAL_MS);

// 縣市不會因為使用者移動幾公尺就變,查詢頻率跟天氣特報更新頻率一樣即可,
// 不需要每次 GPS 定位更新都查一次。
setInterval(() => {
  if(window.currentLat != null && window.currentLon != null){
    updateCurrentCounty(window.currentLat, window.currentLon);
  }
}, CWA_UPDATE_INTERVAL_MS);

// 頁面剛載入、還沒等到第一次 interval 前,先用目前位置查一次(如果已經拿到定位)
setTimeout(() => {
  if(window.currentLat != null && window.currentLon != null){
    updateCurrentCounty(window.currentLat, window.currentLon);
  }
}, 3000);
</script>

<script>
// ===== 🌋 中央氣象署(CWA)地震報告 =====
// E-A0016-001:近期地震報告列表(依時間新到舊排序,第一筆永遠是最新的)。
// 跟天氣特報不同,這份資料沒有「現在有沒有生效中」的欄位——它只是歷史事件列表,
// 所以要自己判斷「多新算新」(EARTHQUAKE_RECENCY_MS),避免舊地震一直掛在畫面上。
// 只有「使用者目前所在縣市」出現在最新一筆地震的有感範圍(Intensity.ShakingArea)
// 而且時間夠新,才會顯示提醒。
const CWA_EQ_AUTH_KEY = "CWA-FFED18F8-F95F-423F-AA3E-5C18BDE89DA1";
const CWA_EQ_UPDATE_INTERVAL_MS = 2 * 60 * 1000; // 地震是突發事件,查詢頻率比天氣特報高一點
const EARTHQUAKE_RECENCY_MS = 30 * 60 * 1000; // 超過30分鐘的舊地震報告不再提醒
const earthquakeAlertEl = document.getElementById("earthquakeAlert");

let latestEarthquake = null;

async function fetchCwaEarthquake(){
  try{
    const res = await fetch(`https://opendata.cwa.gov.tw/api/v1/rest/datastore/E-A0016-001?Authorization=${CWA_EQ_AUTH_KEY}`);
    if(!res.ok){
      console.log("CWA earthquake API http error", res.status);
      return;
    }
    const data = await res.json();
    const list = data?.records?.Earthquake || [];
    latestEarthquake = list[0] || null;
    updateEarthquakeAlertDisplay();
  } catch(err){
    console.log("CWA earthquake fetch failed", err);
  }
}

function updateEarthquakeAlertDisplay(){
  if(!earthquakeAlertEl) return;

  if(!latestEarthquake || !lastKnownCounty){
    earthquakeAlertEl.style.display = "none";
    return;
  }

  const issueTime = new Date(latestEarthquake.IssueTime).getTime();
  const isRecent = !isNaN(issueTime) && (Date.now() - issueTime) < EARTHQUAKE_RECENCY_MS;

  const shakingAreas = latestEarthquake?.Intensity?.ShakingArea || [];
  const affectsCurrentCounty = shakingAreas.some(
    area => normalizeCountyName(area.CountyName) === lastKnownCounty
  );

  if(!isRecent || !affectsCurrentCounty){
    earthquakeAlertEl.style.display = "none";
    return;
  }

  earthquakeAlertEl.textContent = `🌋 ${latestEarthquake.ReportContent || "有感地震"}`;
  earthquakeAlertEl.style.display = "block";
}

fetchCwaEarthquake();
setInterval(fetchCwaEarthquake, CWA_EQ_UPDATE_INTERVAL_MS);
</script>

<script>
(function(){
  /* 等 map 準備好 */
  function init(){
    if(typeof map === 'undefined'){ setTimeout(init, 100); return; }

    /* --- 時鐘 --- */
    const clockEl = document.getElementById('mapClock');
    function tick(){
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      const s = String(now.getSeconds()).padStart(2,'0');
      if(clockEl) clockEl.textContent = h + ':' + m + ':' + s;
    }
    tick();
    setInterval(tick, 1000);

    /* --- 指南針 --- */
    const compassSvg = document.getElementById('compassSvg');
    function updateCompass(){
      const bearing = map.getBearing();
      if(compassSvg) compassSvg.style.transform = 'rotate(' + (-bearing) + 'deg)';
    }
    map.on('rotate', updateCompass);
    map.on('rotateend', updateCompass);

    const compassBtn = document.getElementById('compassBtn');
    if(compassBtn) compassBtn.addEventListener('click', function(){
      map.easeTo({ bearing: 0, pitch: 60, duration: 400 });
    });

    /* --- 定位 --- */
    const locateBtn = document.getElementById('locateBtn');
    if(locateBtn) locateBtn.addEventListener('click', function(){
      if(window.currentLat !== undefined && window.currentLon !== undefined){
        map.easeTo({ center:[window.currentLon, window.currentLat], zoom:17, duration:600 });
        window.followUser = true;
      } else {
        navigator.geolocation.getCurrentPosition(function(pos){
          map.easeTo({ center:[pos.coords.longitude, pos.coords.latitude], zoom:17, duration:600 });
        });
      }
    });

    /* --- 地圖風格切換 --- */
    const STYLES = [
      { icon:'🛰', label:'衛星', style:{
        version:8,
        sources:{ 'esri':{ type:'raster', tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], tileSize:256, maxzoom:19 }},
        layers:[{ id:'bg', type:'background', paint:{'background-color':'#000'}},{ id:'sat', type:'raster', source:'esri'}]
      }},
      { icon:'🗺', label:'街道', style:'https://tiles.openfreemap.org/styles/liberty' },
      { icon:'🌙', label:'夜間', style:{
        version:8,
        sources:{ 'carto-dark':{ type:'raster', tiles:['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png','https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'], tileSize:256, attribution:'© CARTO', maxzoom:19 }},
        layers:[{ id:'bg', type:'background', paint:{'background-color':'#111'}},{ id:'tiles', type:'raster', source:'carto-dark'}]
      }}
    ];
    let styleIdx = 0;
    const styleBtn = document.getElementById('styleBtn');

    function applyStyle(idx){
      const s = STYLES[idx];
      if(styleBtn) styleBtn.textContent = s.icon;
      map.once('styledata', function(){
        /* 重新載入 route/navRoute layers 避免樣式切換後消失 */
        if(typeof window.reloadMapLayers === 'function') window.reloadMapLayers();
      });
      map.setStyle(s.style);
    }

    if(styleBtn) styleBtn.addEventListener('click', function(){
      styleIdx = (styleIdx + 1) % STYLES.length;
      applyStyle(styleIdx);
    });
  }
  init();
})();
</script>

<link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.21.0/video-js.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.21.0/video.min.js"></script>
<video id="bgMusic" class="video-js" style="display:none!important" preload="auto" playsinline></video>
<script>
(function(){
  var BASE = 'https://stream.pbs.gov.tw:443/live/';
  var STATIONS = [
    { code:'mp3:PBS', name:'全國治安交通網', freq:'104.9' },
    { code:'TPS',     name:'台北廣播電台',   freq:'94.3'  },
    { code:'TCS',     name:'台中廣播電台',   freq:'94.5'  },
    { code:'KSS',     name:'高雄廣播電台',   freq:'93.1'  },
    { code:'ELS',     name:'宜蘭廣播電台',   freq:'101.3' },
    { code:'HLS',     name:'花蓮廣播電台',   freq:'94.3'  },
    { code:'TTS',     name:'台東廣播電台',   freq:'94.3'  },
    { code:'SCS',     name:'新竹廣播電台',   freq:'94.9'  },
    { code:'TNS',     name:'台南廣播電台',   freq:'94.7'  },
  ];
  var TICK_W = 60;
  var idx = 0;
  var playing = false;

  var vjs      = videojs('bgMusic', { controls:false, autoplay:false, muted:false, preload:'auto' });
  var nameEl   = document.getElementById('radioName');
  var freqEl   = document.getElementById('radioFreq');
  var statusEl = document.getElementById('radioStatus');
  var playBtn  = document.getElementById('radioPlayBtn');
  var prevBtn  = document.getElementById('radioPrev');
  var nextBtn  = document.getElementById('radioNext');
  var track    = document.getElementById('fmTrack');
  var dial     = document.getElementById('fmDial');

  /* 建立刻度 */
  STATIONS.forEach(function(s, i){
    var tick = document.createElement('div');
    tick.className = 'fmTick' + (i === 0 ? ' active' : '');
    tick.innerHTML = '<div class="tick-line"></div><div class="tick-label">' + s.freq + '</div>';
    track.appendChild(tick);
  });

  function getDialCenter(){ return dial ? dial.offsetWidth / 2 : 0; }

  function updateDial(){
    var offset = getDialCenter() - idx * TICK_W - TICK_W / 2;
    track.style.transform = 'translateX(' + offset + 'px)';
    track.querySelectorAll('.fmTick').forEach(function(t, i){
      t.classList.toggle('active', i === idx);
    });
    if(nameEl)  nameEl.textContent  = STATIONS[idx].name;
    if(freqEl)  freqEl.textContent  = STATIONS[idx].freq + ' MHz';
  }

  var PBS_ART = 'https://upload.wikimedia.org/wikipedia/zh/thumb/d/d1/ROC_Police_Broadcasting_Service_Seal.svg/512px-ROC_Police_Broadcasting_Service_Seal.svg.png';

  function setStatus(t){ if(statusEl) statusEl.textContent = t; }
  function setPlaying(v){
    playing = v;
    if(playBtn) playBtn.classList.toggle('playing', v);
    if('mediaSession' in navigator)
      navigator.mediaSession.playbackState = v ? 'playing' : 'paused';
  }

  function updateMediaSession(){
    if(!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: STATIONS[idx].name,
      artist: '警察廣播電台',
      album: STATIONS[idx].freq + ' MHz',
      artwork: [{ src: PBS_ART, sizes:'512x512', type:'image/png' }]
    });
    navigator.mediaSession.setActionHandler('play',  function(){ startPlay(); });
    navigator.mediaSession.setActionHandler('pause', function(){ pausePlay(); });
    navigator.mediaSession.setActionHandler('stop',  function(){ pausePlay(); });
  }

  function startPlay(){
    setStatus('連線中…');
    updateMediaSession();
    vjs.src([{ src: BASE + STATIONS[idx].code + '/playlist.m3u8', type:'application/x-mpegURL' }]);
    vjs.play().catch(function(){ setPlaying(false); setStatus('點擊收聽'); });
  }
  function pausePlay(){ vjs.pause(); setPlaying(false); setStatus('已暫停'); }

  function switchStation(delta){
    idx = (idx + delta + STATIONS.length) % STATIONS.length;
    updateDial();
    if(playing){ vjs.pause(); startPlay(); }
    else { setStatus('點擊收聽'); }
  }

  if(prevBtn) prevBtn.addEventListener('click', function(e){ e.stopPropagation(); switchStation(-1); });
  if(nextBtn) nextBtn.addEventListener('click', function(e){ e.stopPropagation(); switchStation(1); });
  if(playBtn) playBtn.addEventListener('click', function(e){ e.stopPropagation(); playing ? pausePlay() : startPlay(); });

  /* 拖曳刻度盤換台：手指跟著動，放開才 snap */
  if(dial){
    var dragStart = null, baseOffset = null, dragging = false;

    function getOffset(i){ return getDialCenter() - i * TICK_W - TICK_W / 2; }

    function onDown(e){
      var mat = window.getComputedStyle(track).transform;
      baseOffset = (mat && mat !== 'none') ? new DOMMatrix(mat).m41 : getOffset(idx);
      track.style.transition = 'none';
      track.style.transform = 'translateX(' + baseOffset + 'px)';
      dragStart = e.touches ? e.touches[0].clientX : e.clientX;
      dragging = true;
      e.stopPropagation();
    }
    function onMove(e){
      if(!dragging) return;
      var x = e.touches ? e.touches[0].clientX : e.clientX;
      var dx = x - dragStart;
      track.style.transform = 'translateX(' + (baseOffset + dx) + 'px)';
      /* 即時高亮最近的刻度 */
      var newIdx = Math.round((getDialCenter() - TICK_W / 2 - (baseOffset + dx)) / TICK_W);
      newIdx = Math.max(0, Math.min(STATIONS.length - 1, newIdx));
      track.querySelectorAll('.fmTick').forEach(function(t, i){
        t.classList.toggle('active', i === newIdx);
      });
      if(newIdx !== idx){
        idx = newIdx;
        if(nameEl) nameEl.textContent = STATIONS[idx].name;
        if(freqEl) freqEl.textContent = STATIONS[idx].freq + ' MHz';
        updateMediaSession();
        if(playing){ vjs.pause(); startPlay(); }
      }
      e.preventDefault();
    }
    function onUp(){
      if(!dragging) return;
      dragging = false;
      dragStart = null;
      /* snap 動畫 */
      track.style.transition = 'transform 0.2s cubic-bezier(.4,0,.2,1)';
      track.style.transform = 'translateX(' + getOffset(idx) + 'px)';
      if(!playing) setStatus('點擊收聽');
    }
    dial.addEventListener('mousedown',  onDown);
    dial.addEventListener('touchstart', onDown, { passive:false });
    window.addEventListener('mousemove',  onMove);
    window.addEventListener('touchmove',  onMove, { passive:false });
    window.addEventListener('mouseup',  onUp);
    window.addEventListener('touchend', onUp);
  }

  vjs.on('playing', function(){ setPlaying(true); setStatus('直播中'); });
  vjs.on('waiting', function(){ if(playing) setStatus('緩衝中…'); });
  vjs.on('error',   function(){ setPlaying(false); setStatus('點擊重試'); });
  vjs.on('pause',   function(){ if(playing){ setPlaying(false); setStatus('已暫停'); } });
  window.addEventListener('pagehide', function(){ if(playing) pausePlay(); });

  updateDial();
})();
</script>
</body>
</html>
