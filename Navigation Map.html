  const ROAD_SOURCE    = 'draw-roads';
  const MARKING_SOURCE = 'draw-markings';
  const PREVIEW_SOURCE = 'draw-preview';
  const VERTEX_SOURCE  = 'draw-vertices';
  const SNAP_PX = 14; // 吸附半徑（像素）

  // ── GeoJSON helpers ──────────────────────────────────────────
  function toRoadGeoJSON() {
    return { type:'FeatureCollection', features: drawnRoads.map(r=>({
      type:'Feature', geometry:{ type:'Polygon', coordinates:[r] }
    }))};
  }
  function toMarkingGeoJSON() {
    return { type:'FeatureCollection', features: drawnMarkings.map(m=>({
      type:'Feature',
      properties:{ color:m.color, width:m.width },
      geometry:{ type:'LineString', coordinates:m.coords }
    }))};
  }
  function toPreviewGeoJSON() {
    if (currentPoints.length < 2) return { type:'FeatureCollection', features:[] };
    const coords = bezierMode ? catmullRom(currentPoints) : currentPoints;
    return { type:'FeatureCollection', features:[{
      type:'Feature', geometry:{ type:'LineString', coordinates:coords }
    }]};
  }
  // 蒐集所有已確認幾何的頂點（用於繪製時顯示延伸點）
  function toVertexGeoJSON() {
    const pts = [];
    drawnRoads.forEach(r => r.slice(0,-1).forEach(c =>
      pts.push({ type:'Feature', geometry:{ type:'Point', coordinates:c } })));
    drawnMarkings.forEach(m => m.coords.forEach(c =>
      pts.push({ type:'Feature', geometry:{ type:'Point', coordinates:c } })));
    return { type:'FeatureCollection', features: pts };
  }

  function updateSources() {
    if (!map.getSource(ROAD_SOURCE)) return;
    map.getSource(ROAD_SOURCE).setData(toRoadGeoJSON());
    map.getSource(MARKING_SOURCE).setData(toMarkingGeoJSON());
    map.getSource(PREVIEW_SOURCE).setData(toPreviewGeoJSON());
    map.getSource(VERTEX_SOURCE).setData(toVertexGeoJSON());
    // 頂點只在繪製模式顯示
    map.setLayoutProperty('draw-vertices-circle', 'visibility', drawMode ? 'visible' : 'none');
    document.getElementById('drawFinishBtn').disabled = currentPoints.length < 2;
  }

  function initDrawLayers() {
    map.addSource(ROAD_SOURCE,    { type:'geojson', data: toRoadGeoJSON() });
    map.addSource(MARKING_SOURCE, { type:'geojson', data: toMarkingGeoJSON() });
    map.addSource(PREVIEW_SOURCE, { type:'geojson', data: toPreviewGeoJSON() });
    map.addSource(VERTEX_SOURCE,  { type:'geojson', data: toVertexGeoJSON() });

    // 道路面（灰、不透明、無邊框）
    map.addLayer({ id:'draw-road-fill', type:'fill', source:ROAD_SOURCE,
      paint:{ 'fill-color':'#555', 'fill-opacity':1 } });

    // 標線（方形線端，無圓角）
    map.addLayer({ id:'draw-marking-line', type:'line', source:MARKING_SOURCE,
      layout:{ 'line-join':'miter', 'line-cap':'butt' },
      paint:{ 'line-color':['get','color'], 'line-width':['get','width'], 'line-opacity':1 }
    });

    // 預覽虛線（方形）
    map.addLayer({ id:'draw-preview-line', type:'line', source:PREVIEW_SOURCE,
      layout:{ 'line-join':'miter', 'line-cap':'butt' },
      paint:{ 'line-color':'#2F80FF', 'line-width':2, 'line-dasharray':[4,3], 'line-opacity':0.8 }
    });

    // 頂點圓點（繪製模式才顯示）
    map.addLayer({ id:'draw-vertices-circle', type:'circle', source:VERTEX_SOURCE,
      layout:{ visibility:'none' },
      paint:{
        'circle-radius': 6,
        'circle-color': '#ffffff',
        'circle-stroke-color': '#2F80FF',
        'circle-stroke-width': 2,
        'circle-opacity': 0.9
      }
    });
  }

  map.on('load', initDrawLayers);

  // ── 吸附：找最近頂點 ─────────────────────────────────────────
  function findSnapPoint(lngLat) {
    if (!drawMode) return null;
    const clickPx = map.project(lngLat);
    let best = null, bestD = SNAP_PX;
    function check(coord) {
      const px = map.project({ lng: coord[0], lat: coord[1] });
      const d = Math.hypot(px.x - clickPx.x, px.y - clickPx.y);
      if (d < bestD) { bestD = d; best = coord; }
    }
    drawnRoads.forEach(r => r.slice(0,-1).forEach(check));
    drawnMarkings.forEach(m => m.coords.forEach(check));
    return best;
  }

  // ── 地圖事件 ─────────────────────────────────────────────────
  map.on('click', function(e) {
    if (!drawMode) return;
    const snap = findSnapPoint(e.lngLat);
    const pt = snap ? snap : [e.lngLat.lng, e.lngLat.lat];
    currentPoints.push(pt);
    updateSources();
    const snapTip = snap ? '（吸附到現有頂點）' : '';
    showHint(drawMode === 'road'
      ? `已加 ${currentPoints.length} 個頂點${snapTip}，雙擊完成閉合`
      : `已加 ${currentPoints.length} 個點${snapTip}，雙擊完成線段`);
  });

  map.on('dblclick', function(e) {
    if (!drawMode || currentPoints.length < 2) return;
    e.preventDefault();
    finishDrawing();
  });

  map.on('mousemove', function(e) {
    if (!drawMode || currentPoints.length === 0) return;
    const snap = findSnapPoint(e.lngLat);
    const tip = snap ? snap : [e.lngLat.lng, e.lngLat.lat];
    map.getCanvas().style.cursor = snap ? 'pointer' : 'crosshair';
    const previewPts = [...currentPoints, tip];
    const previewCoords = bezierMode && previewPts.length >= 2 ? catmullRom(previewPts) : previewPts;
    map.getSource(PREVIEW_SOURCE).setData({ type:'FeatureCollection', features:[{
      type:'Feature', geometry:{ type:'LineString', coordinates:previewCoords }
    }]});
  });

  // ── 公開函式 ─────────────────────────────────────────────────
  window.setDrawMode = function(mode) {
    drawMode = mode;
    currentPoints = [];
    document.getElementById('modeRoad').classList.toggle('active', mode === 'road');
    document.getElementById('modeMarking').classList.toggle('active', mode === 'marking');
    const isMark = mode === 'marking';
    document.getElementById('colorLabel').style.display = isMark ? '' : 'none';
    document.getElementById('drawColorRow').style.display = isMark ? 'flex' : 'none';
    document.getElementById('widthLabel').style.display = isMark ? '' : 'none';
    document.getElementById('drawWidthRow').style.display = isMark ? 'flex' : 'none';
    map.getCanvas().style.cursor = 'crosshair';
    map.doubleClickZoom.disable();
    updateSources();
    showHint(mode === 'road'
      ? '點擊新增頂點，靠近現有點可吸附延伸，雙擊完成'
      : '點擊新增點，靠近現有點可吸附延伸，雙擊完成');
  };

  window.setMarkingColor = function(el) {
    markingColor = el.dataset.color;
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
    el.classList.add('selected');
  };

  window.setMarkingWidth = function(el) {
    markingWidth = parseInt(el.dataset.w);
    document.querySelectorAll('.width-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
  };

  window.finishDrawing = function() {
    if (currentPoints.length < 2) return;
    if (drawMode === 'road') {
      const ring = bezierMode && currentPoints.length >= 3
        ? catmullRomClosed(currentPoints)
        : [...currentPoints, currentPoints[0]];
      drawnRoads.push(ring);
    } else if (drawMode === 'marking') {
      const coords = bezierMode && currentPoints.length >= 3
        ? catmullRom(currentPoints)
        : [...currentPoints];
      drawnMarkings.push({ coords, color:markingColor, width:markingWidth });
    }
    currentPoints = [];
    updateSources();
    hideHint();
  };

  window.undoLastFeature = function() {
    if (currentPoints.length > 0) {
      currentPoints.pop();
    } else if (drawMode === 'road' && drawnRoads.length > 0) {
      drawnRoads.pop();
    } else if (drawMode === 'marking' && drawnMarkings.length > 0) {
      drawnMarkings.pop();
    }
    updateSources();
  };

  window.clearAllDrawings = function() {
    if (!confirm('清除所有繪製的道路和標線？')) return;
    drawnRoads = []; drawnMarkings = []; currentPoints = [];
    updateSources();
    hideHint();
  };

  window.exportDrawings = function() {
    const data = JSON.stringify({ roads: drawnRoads, markings: drawnMarkings }, null, 2);
    navigator.clipboard.writeText(data).then(() => {
      const btn = document.getElementById('drawExportBtn');
      btn.textContent = '✅ 已複製！';
      setTimeout(() => { btn.textContent = '📋 複製資料'; }, 2000);
    });
  };

  window.importDrawings = function() {
    navigator.clipboard.readText().then(text => {
      try {
        const data = JSON.parse(text);
        if (data.roads) drawnRoads = data.roads;
        if (data.markings) drawnMarkings = data.markings;
        currentPoints = [];
        updateSources();
        const btn = document.getElementById('drawImportBtn');
        btn.textContent = '✅ 已還原！';
        setTimeout(() => { btn.textContent = '📥 貼上還原'; }, 2000);
      } catch(e) {
        alert('格式錯誤，請確認複製的是正確的繪製資料。');
      }
    });
  };

  window.toggleBezier = function() {
    bezierMode = !bezierMode;
    document.getElementById('bezierBtn').classList.toggle('active', bezierMode);
  };

  window.addRoad = function(coords) {
    drawnRoads.push(coords);
    updateSources();
  };

  window.getDrawings = function() {
    return { roads: drawnRoads, markings: drawnMarkings };
  };

  window.toggleDrawVisibility = function() {
    layersVisible = !layersVisible;
    const v = layersVisible ? 'visible' : 'none';
    ['draw-road-fill','draw-marking-line'].forEach(id => {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', v);
    });
    document.getElementById('drawVisibilityBtn').textContent =
      layersVisible ? '👁 隱藏圖層' : '👁 顯示圖層';
  };

  function showHint(text) {
    const el = document.getElementById('drawHint');
    el.textContent = text;
    el.style.display = 'block';
  }
  function hideHint() {
    document.getElementById('drawHint').style.display = 'none';
  }

  document.getElementById('drawToggleBtn').addEventListener('click', function() {
    const panel = document.getElementById('drawPanel');
    const isOpen = panel.classList.toggle('open');
    this.classList.toggle('active', isOpen);
    if (!isOpen) {
      drawMode = null;
      currentPoints = [];
      map.getCanvas().style.cursor = '';
      map.doubleClickZoom.enable();
      document.getElementById('modeRoad').classList.remove('active');
      document.getElementById('modeMarking').classList.remove('active');
      hideHint();
      updateSources();
    }
  });
})();
</script>

<!-- ===== 模擬導航 ===== -->
<script>
(function(){
  let running = false, route = [], idx = 0, frac = 0;
  let lastTs = null, rafId = null, speedKmh = 100, loopRoute = true;
  let simMarker = null;
  let followCam = true, resumeTimer = null;

  function hav(a, b) {
    const R = 6371000;
    const f1 = a[1]*Math.PI/180, f2 = b[1]*Math.PI/180;
    const df = (b[1]-a[1])*Math.PI/180, dl = (b[0]-a[0])*Math.PI/180;
    const x = Math.sin(df/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
    return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
  }

  function brng(a, b) {
    const dl = (b[0]-a[0])*Math.PI/180;
    const f1 = a[1]*Math.PI/180, f2 = b[1]*Math.PI/180;
    return (Math.atan2(Math.sin(dl)*Math.cos(f2),
      Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl))*180/Math.PI+360)%360;
  }

  // Metres between two [lng,lat] points (fast planar approx)
  function mDist(a, b) {
    const dx = (b[0]-a[0]) * 111320 * Math.cos(a[1]*Math.PI/180);
    const dy = (b[1]-a[1]) * 110540;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function buildRoute() {
    const d = window.getDrawings ? window.getDrawings() : { markings: [] };
    if (!d.markings.length) return [];
    // Pick the marking that sits in the densest cluster of other markings.
    // Score = number of other-marking points within 6 m × own point count.
    let best = d.markings[0], bestScore = -1;
    d.markings.forEach((m, mi) => {
      let near = 0;
      m.coords.forEach(c =>
        d.markings.forEach((m2, mi2) => {
          if (mi2 !== mi) m2.coords.forEach(c2 => { if (mDist(c, c2) < 6) near++; });
        })
      );
      const score = near * m.coords.length;
      if (score > bestScore) { bestScore = score; best = m; }
    });
    const coords = best.coords;
    return coords.filter((p, i) => i === 0 || hav(p, coords[i-1]) > 0.05);
  }

  function makeCarEl() {
    const el = document.createElement('div');
    el.className = 'car-marker';
    el.innerHTML = `<svg viewBox="0 0 32 48" width="32" height="48" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="8" width="24" height="34" rx="7" fill="#FF6600" stroke="#fff" stroke-width="2"/>
      <rect x="6.5" y="11" width="19" height="10" rx="3" fill="rgba(255,255,255,0.65)"/>
      <rect x="6.5" y="29" width="19" height="9" rx="3" fill="rgba(255,255,255,0.4)"/>
      <rect x="1" y="10" width="5" height="8" rx="2" fill="#222"/>
      <rect x="26" y="10" width="5" height="8" rx="2" fill="#222"/>
      <rect x="1" y="30" width="5" height="8" rx="2" fill="#222"/>
      <rect x="26" y="30" width="5" height="8" rx="2" fill="#222"/>
      <polygon points="16,1 11,10 21,10" fill="#FFC107"/>
    </svg>`;
    return el;
  }

  // Find the route index closest to the densest cluster of markings
  function findDensestIdx(route) {
    const d = window.getDrawings ? window.getDrawings() : { markings: [] };
    let bestIdx = 0, bestCount = 0;
    route.forEach((pt, i) => {
      let count = 0;
      d.markings.forEach(m => m.coords.forEach(c => { if (mDist(pt, c) < 6) count++; }));
      if (count > bestCount) { bestCount = count; bestIdx = i; }
    });
    return bestIdx;
  }

  function startSim() {
    route = buildRoute();
    if (route.length < 2) { alert('請先畫道路標線（至少兩個點）'); return; }
    idx = findDensestIdx(route); frac = 0; lastTs = null;
    if (!simMarker) {
      simMarker = new maplibregl.Marker({ element: makeCarEl(), anchor: 'center', rotationAlignment: 'map' })
        .setLngLat(route[idx]).addTo(map);
    } else {
      simMarker.setLngLat(route[idx]);
    }
    running = true; followCam = true; window.simRunning = true;
    document.getElementById('simStartBtn').textContent = '⏹ 停止';
    // rect6 speedometer taken over by sim — show km/h unit
    document.querySelector('.rect6 .speed-unit').innerText = 'km/h';
    // Auto-hide panel so car isn't blocked on mobile
    document.getElementById('simPanel').classList.remove('open');
    const sb = document.getElementById('simBtn');
    sb.textContent = '⏹';
    sb.classList.add('active');
    sb.title = '停止導航';
    rafId = requestAnimationFrame(tick);
  }

  function stopSim() {
    running = false; window.simRunning = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (simMarker) { simMarker.remove(); simMarker = null; }
    document.getElementById('simStartBtn').textContent = '▶ 開始';
    // Release rect6 back to GPS (reset to 0 until GPS fires again)
    document.querySelector('.rect6 .speed-value').innerText = '0';
    document.querySelector('.rect6 .speed-unit').innerText = 'km/h';
    // Restore panel and button
    document.getElementById('simPanel').classList.add('open');
    const sb = document.getElementById('simBtn');
    sb.textContent = '🚙';
    sb.classList.add('active');
    sb.title = '模擬導航';
  }

  function tick(ts) {
    if (!running) return;
    if (!lastTs) { lastTs = ts; rafId = requestAnimationFrame(tick); return; }
    const dt = Math.min((ts - lastTs) / 1000, 0.1);
    lastTs = ts;
    let dist = speedKmh / 3.6 * dt;

    while (dist > 0 && idx < route.length - 1) {
      const seg = hav(route[idx], route[idx+1]);
      if (seg < 0.001) { idx++; continue; }
      const rem = seg * (1 - frac);
      if (dist >= rem) { dist -= rem; idx++; frac = 0; }
      else { frac += dist / seg; dist = 0; }
    }

    if (idx >= route.length - 1) {
      if (loopRoute) { idx = 0; frac = 0; }
      else { stopSim(); return; }
    }

    const a = route[idx], b = route[Math.min(idx+1, route.length-1)];
    const lng = a[0] + (b[0]-a[0])*frac;
    const lat = a[1] + (b[1]-a[1])*frac;
    const h = brng(a, b);

    // Place car at midpoint of two nearest points from DIFFERENT markings (≤10 m)
    let dLng = lng, dLat = lat;
    if (window.getDrawings) {
      const allM = window.getDrawings().markings;
      let b1 = null, b1mi = -1, b1d = Infinity, b2 = null, b2d = Infinity;
      allM.forEach((m, mi) => m.coords.forEach(c => {
        const dist = mDist([lng, lat], c);
        if (dist < b1d) { b2 = b1; b2d = b1d; b1 = c; b1mi = mi; b1d = dist; }
        else if (mi !== b1mi && dist < b2d) { b2 = c; b2d = dist; }
      }));
      if (b1 && b2 && b2d < 10) { dLng = (b1[0]+b2[0])/2; dLat = (b1[1]+b2[1])/2; }
    }
    simMarker.setLngLat([dLng, dLat]).setRotation(h);
    document.querySelector('.rect6 .speed-value').innerText = speedKmh;
    if (followCam) map.easeTo({ center: [dLng, dLat], bearing: h, pitch: 65, duration: 150 });

    rafId = requestAnimationFrame(tick);
  }

  // Panel toggle — if running, clicking the button stops the sim
  document.getElementById('simBtn').addEventListener('click', function() {
    if (running) { stopSim(); return; }
    const panel = document.getElementById('simPanel');
    const open = panel.classList.toggle('open');
    this.classList.toggle('active', open);
  });

  document.getElementById('simStartBtn').addEventListener('click', () => running ? stopSim() : startSim());

  document.getElementById('simSpeedSlider').addEventListener('input', function() {
    speedKmh = +this.value;
    document.getElementById('simSpeedLabel').textContent = speedKmh + ' km/h';
    document.getElementById('simSpeedVal').textContent = speedKmh;
  });

  document.getElementById('simLoopChk').addEventListener('change', function() {
    loopRoute = this.checked;
  });

  // Pause camera follow when user manually pans/zooms; resume after 3 s
  map.on('movestart', function(e) {
    if (!running || !e.originalEvent) return;
    followCam = false;
    clearTimeout(resumeTimer);
    resumeTimer = setTimeout(() => { followCam = true; }, 3000);
  });
})();
</script>

<!-- ===== AI 衛星描邊 ===== -->
<script>
(function(){
  const btn = document.getElementById('aiTraceBtn');
  let traceMode = false;

  btn.addEventListener('click', () => {
    traceMode = !traceMode;
    btn.classList.toggle('active', traceMode);
    map.getCanvas().style.cursor = traceMode ? 'crosshair' : '';
  });

  map.on('click', function(e) {
    if (!traceMode) return;
    e.preventDefault();
    runTrace(e.point.x, e.point.y);
  });

  function runTrace(cssX, cssY) {
    const canvas = map.getCanvas();
    const dpr = window.devicePixelRatio || 1;

    // Capture WebGL canvas into 2D temp canvas
    const tmp = document.createElement('canvas');
    tmp.width = canvas.width;
    tmp.height = canvas.height;
    const ctx = tmp.getContext('2d');
    ctx.drawImage(canvas, 0, 0);

    const cx = Math.round(cssX * dpr);
    const cy = Math.round(cssY * dpr);

    // Crop a patch around click (±250 canvas px)
    const R = Math.round(250 * dpr);
    const px = Math.max(0, cx - R), py = Math.max(0, cy - R);
    const pw = Math.min(canvas.width - px, R * 2);
    const ph = Math.min(canvas.height - py, R * 2);

    const imgData = ctx.getImageData(px, py, pw, ph);
    const d = imgData.data;
    const W = pw, H = ph;

    // Seed in patch coords
    const sx = cx - px, sy = cy - py;
    if (sx < 0 || sx >= W || sy < 0 || sy >= H) return;

    const sidx = (sy * W + sx) * 4;
    const sr = d[sidx], sg = d[sidx+1], sb = d[sidx+2];

    // BFS region grow (4-connected, color distance < tolerance)
    const TOL = 40;
    const MAX_PX = 100000;
    const region = new Uint8Array(W * H);
    const q = [sy * W + sx];
    region[sy * W + sx] = 1;
    let head = 0;

    while (head < q.length && head < MAX_PX) {
      const idx = q[head++];
      const x = idx % W, y = (idx / W) | 0;
      const steps = [[-1,0],[1,0],[0,-1],[0,1]];
      for (const [dx, dy] of steps) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
        const ni = ny * W + nx;
        if (region[ni]) continue;
        const pi = ni * 4;
        const dr = d[pi]-sr, dg = d[pi+1]-sg, db = d[pi+2]-sb;
        if (Math.sqrt(dr*dr + dg*dg + db*db) < TOL) {
          region[ni] = 1;
          q.push(ni);
        }
      }
    }

    // Scanline → polygon (left column top→bottom, right column bottom→top)
    const leftPts = [], rightPts = [];
    for (let y = 0; y < H; y++) {
      let l = -1, r = -1;
      for (let x = 0; x < W; x++) {
        if (region[y * W + x]) { if (l < 0) l = x; r = x; }
      }
      if (l >= 0) { leftPts.push([l, y]); rightPts.push([r, y]); }
    }

    if (leftPts.length < 4) return;

    const poly = [...leftPts, ...rightPts.reverse()];

    // Subsample to ≤ 120 points
    const step = Math.max(1, Math.ceil(poly.length / 120));
    const sampled = poly.filter((_, i) => i % step === 0);

    // Convert patch pixels → LngLat
    const coords = sampled.map(([bx, by]) => {
      const ll = map.unproject([(px + bx) / dpr, (py + by) / dpr]);
      return [ll.lng, ll.lat];
    });
    coords.push(coords[0]); // close ring

    // Push into drawnRoads and refresh
    window.addRoad(coords);
  }
})();
</script>

<!-- ===== GPS 定位車 ===== -->
<script>
(function(){
  const btn = document.getElementById('gpsBtn');
  let watchId = null;
  let carMarker = null;
  let lastHeading = 0;
  let active = false;

  function makeCarEl() {
    const el = document.createElement('div');
    el.className = 'car-marker';
    el.innerHTML = `<svg viewBox="0 0 32 48" width="32" height="48" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="8" width="24" height="34" rx="7" fill="#1976D2" stroke="#fff" stroke-width="2"/>
      <rect x="6.5" y="11" width="19" height="10" rx="3" fill="rgba(255,255,255,0.65)"/>
      <rect x="6.5" y="29" width="19" height="9" rx="3" fill="rgba(255,255,255,0.4)"/>
      <rect x="1" y="10" width="5" height="8" rx="2" fill="#222"/>
      <rect x="26" y="10" width="5" height="8" rx="2" fill="#222"/>
      <rect x="1" y="30" width="5" height="8" rx="2" fill="#222"/>
      <rect x="26" y="30" width="5" height="8" rx="2" fill="#222"/>
      <polygon points="16,1 11,10 21,10" fill="#FFC107"/>
    </svg>`;
    return el;
  }

  function circleCoords(lat, lng, radiusM) {
    const pts = 64, R = 6378137, coords = [];
    for (let i = 0; i <= pts; i++) {
      const a = (i / pts) * 2 * Math.PI;
      const dlat = (radiusM * Math.cos(a)) / R * (180 / Math.PI);
      const dlng = (radiusM * Math.sin(a)) / (R * Math.cos(lat * Math.PI / 180)) * (180 / Math.PI);
      coords.push([lng + dlng, lat + dlat]);
    }
    return coords;
  }

  function onPosition(pos) {
    const { latitude: lat, longitude: lng, heading, accuracy } = pos.coords;
    if (heading !== null && !isNaN(heading)) lastHeading = heading;

    if (!carMarker) {
      carMarker = new maplibregl.Marker({ element: makeCarEl(), anchor: 'center', rotationAlignment: 'map' })
        .setLngLat([lng, lat])
        .setRotation(lastHeading)
        .addTo(map);
    } else {
      carMarker.setLngLat([lng, lat]).setRotation(lastHeading);
    }

    map.easeTo({ center: [lng, lat], duration: 600 });

    const accData = { type: 'FeatureCollection', features: [{
      type: 'Feature',
      geometry: { type: 'Polygon', coordinates: [circleCoords(lat, lng, accuracy)] }
    }]};
    const src = map.getSource('gps-acc');
    if (src) src.setData(accData);
  }

  function start() {
    if (!map.getSource('gps-acc')) {
      map.addSource('gps-acc', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      const before = map.getLayer('draw-road-fill') ? 'draw-road-fill' : undefined;
      map.addLayer({ id: 'gps-acc-fill', type: 'fill', source: 'gps-acc',
        paint: { 'fill-color': '#2196F3', 'fill-opacity': 0.12 } }, before);
      map.addLayer({ id: 'gps-acc-line', type: 'line', source: 'gps-acc',
        paint: { 'line-color': '#2196F3', 'line-width': 1.5, 'line-opacity': 0.5 } }, before);
    }
    watchId = navigator.geolocation.watchPosition(onPosition,
      e => console.warn('GPS:', e.message),
      { enableHighAccuracy: true, maximumAge: 1000 });
    active = true;
    btn.classList.add('active');
  }

  function stop() {
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (carMarker) { carMarker.remove(); carMarker = null; }
    if (map.getLayer('gps-acc-fill')) map.removeLayer('gps-acc-fill');
    if (map.getLayer('gps-acc-line')) map.removeLayer('gps-acc-line');
    if (map.getSource('gps-acc')) map.removeSource('gps-acc');
    active = false;
    btn.classList.remove('active');
  }

  btn.addEventListener('click', () => active ? stop() : start());
})();
</script>

<link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.21.0/video-js.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.21.0/video.min.js"></script>
<video id="bgMusic" class="video-js" style="display:none!important" preload="auto" playsinline></video>
<script>
(function(){
  var BASE = 'https://stream.pbs.gov.tw:443/live/';
  var STATIONS = [
    { code:'mp3:PBS', name:'全國治安交通網', freq:'104.9' },
    { code:'TPS',     name:'台北廣播電台',   freq:'94.3'  },
    { code:'TCS',     name:'台中廣播電台',   freq:'94.5'  },
    { code:'KSS',     name:'高雄廣播電台',   freq:'93.1'  },
    { code:'ELS',     name:'宜蘭廣播電台',   freq:'101.3' },
    { code:'HLS',     name:'花蓮廣播電台',   freq:'94.3'  },
    { code:'TTS',     name:'台東廣播電台',   freq:'94.3'  },
    { code:'SCS',     name:'新竹廣播電台',   freq:'94.9'  },
    { code:'TNS',     name:'台南廣播電台',   freq:'94.7'  },
  ];
  var TICK_W = 60;
  var idx = 0;
  var playing = false;

  var vjs      = videojs('bgMusic', { controls:false, autoplay:false, muted:false, preload:'auto' });
  var nameEl   = document.getElementById('radioName');
  var freqEl   = document.getElementById('radioFreq');
  var statusEl = document.getElementById('radioStatus');
  var playBtn  = document.getElementById('radioPlayBtn');
  var prevBtn  = document.getElementById('radioPrev');
  var nextBtn  = document.getElementById('radioNext');
  var track    = document.getElementById('fmTrack');
  var dial     = document.getElementById('fmDial');

  /* 建立刻度 */
  STATIONS.forEach(function(s, i){
    var tick = document.createElement('div');
    tick.className = 'fmTick' + (i === 0 ? ' active' : '');
    tick.innerHTML = '<div class="tick-line"></div><div class="tick-label">' + s.freq + '</div>';
    track.appendChild(tick);
  });

  function getDialCenter(){ return dial ? dial.offsetWidth / 2 : 0; }

  function updateDial(){
    var offset = getDialCenter() - idx * TICK_W - TICK_W / 2;
    track.style.transform = 'translateX(' + offset + 'px)';
    track.querySelectorAll('.fmTick').forEach(function(t, i){
      t.classList.toggle('active', i === idx);
    });
    if(nameEl)  nameEl.textContent  = STATIONS[idx].name;
    if(freqEl)  freqEl.textContent  = STATIONS[idx].freq + ' MHz';
  }

  var PBS_ART = 'https://upload.wikimedia.org/wikipedia/zh/thumb/d/d1/ROC_Police_Broadcasting_Service_Seal.svg/512px-ROC_Police_Broadcasting_Service_Seal.svg.png';

  function setStatus(t){ if(statusEl) statusEl.textContent = t; }
  function setPlaying(v){
    playing = v;
    if(playBtn) playBtn.classList.toggle('playing', v);
    if('mediaSession' in navigator)
      navigator.mediaSession.playbackState = v ? 'playing' : 'paused';
  }

  function updateMediaSession(){
    if(!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: STATIONS[idx].name,
      artist: '警察廣播電台',
      album: STATIONS[idx].freq + ' MHz',
      artwork: [{ src: PBS_ART, sizes:'512x512', type:'image/png' }]
    });
    navigator.mediaSession.setActionHandler('play',  function(){ startPlay(); });
    navigator.mediaSession.setActionHandler('pause', function(){ pausePlay(); });
    navigator.mediaSession.setActionHandler('stop',  function(){ pausePlay(); });
  }

  function startPlay(){
    setStatus('連線中…');
    updateMediaSession();
    vjs.src([{ src: BASE + STATIONS[idx].code + '/playlist.m3u8', type:'application/x-mpegURL' }]);
    vjs.play().catch(function(){ setPlaying(false); setStatus('點擊收聽'); });
  }
  function pausePlay(){ vjs.pause(); setPlaying(false); setStatus('已暫停'); }

  function switchStation(delta){
    idx = (idx + delta + STATIONS.length) % STATIONS.length;
    updateDial();
    if(playing){ vjs.pause(); startPlay(); }
    else { setStatus('點擊收聽'); }
  }

  if(prevBtn) prevBtn.addEventListener('click', function(e){ e.stopPropagation(); switchStation(-1); });
  if(nextBtn) nextBtn.addEventListener('click', function(e){ e.stopPropagation(); switchStation(1); });
  if(playBtn) playBtn.addEventListener('click', function(e){ e.stopPropagation(); playing ? pausePlay() : startPlay(); });

  /* 拖曳刻度盤換台：手指跟著動，放開才 snap */
  if(dial){
    var dragStart = null, baseOffset = null, dragging = false;

    function getOffset(i){ return getDialCenter() - i * TICK_W - TICK_W / 2; }

    function onDown(e){
      dragStart = e.touches ? e.touches[0].clientX : e.clientX;
      baseOffset = getOffset(idx);
      dragging = true;
      track.style.transition = 'none';
      e.stopPropagation();
    }
    function onMove(e){
      if(!dragging) return;
      var x = e.touches ? e.touches[0].clientX : e.clientX;
      var dx = x - dragStart;
      track.style.transform = 'translateX(' + (baseOffset + dx) + 'px)';
      /* 即時高亮最近的刻度 */
      var newIdx = Math.round((getDialCenter() - TICK_W / 2 - (baseOffset + dx)) / TICK_W);
      newIdx = Math.max(0, Math.min(STATIONS.length - 1, newIdx));
      track.querySelectorAll('.fmTick').forEach(function(t, i){
        t.classList.toggle('active', i === newIdx);
      });
      if(newIdx !== idx){
        idx = newIdx;
        if(nameEl) nameEl.textContent = STATIONS[idx].name;
        if(freqEl) freqEl.textContent = STATIONS[idx].freq + ' MHz';
        updateMediaSession();
        if(playing){ vjs.pause(); startPlay(); }
      }
      e.preventDefault();
    }
    function onUp(){
      if(!dragging) return;
      dragging = false;
      dragStart = null;
      /* snap 動畫 */
      track.style.transition = 'transform 0.2s cubic-bezier(.4,0,.2,1)';
      track.style.transform = 'translateX(' + getOffset(idx) + 'px)';
      if(!playing) setStatus('點擊收聽');
    }
    dial.addEventListener('mousedown',  onDown);
    dial.addEventListener('touchstart', onDown, { passive:false });
    window.addEventListener('mousemove',  onMove);
    window.addEventListener('touchmove',  onMove, { passive:false });
    window.addEventListener('mouseup',  onUp);
    window.addEventListener('touchend', onUp);
  }

  vjs.on('playing', function(){ setPlaying(true); setStatus('直播中'); });
  vjs.on('waiting', function(){ if(playing) setStatus('緩衝中…'); });
  vjs.on('error',   function(){ setPlaying(false); setStatus('點擊重試'); });
  vjs.on('pause',   function(){ if(playing){ setPlaying(false); setStatus('已暫停'); } });
  window.addEventListener('pagehide', function(){ if(playing) pausePlay(); });

  updateDial();
})();
</script>
</body>
